# Test-owned. Pins the Ed-Fi API image the stock-image proof runs, and only that image.
#
# Composed through DMS_PLUGINS_COMPOSE_FILES, which both launchers append after the application
# file, so this overrides published-dms.yml's `image:` rather than being overridden by it. The
# committed acquisition overlays are added the same way and are not edited to accommodate this one.
#
# Declared with :? rather than a default, for the reason the committed recipes give for theirs: the
# whole point of this proof is that it runs a named, published artifact, and a silent default is how
# a run ends up proving something about an image nobody pinned. A moving tag is refused by the
# harness before Compose is reached; what belongs here is a version-specific tag and a digest.
#
# The Configuration Service is not pinned here. It has its own whole-reference variable,
# DMS_CONFIG_DOCKER_IMAGE in published-config.yml, because the two services shared DMS_IMAGE_TAG and
# a digest is meaningful only against the repository it was published under.
services:
  dms:
    image: ${DMS_STOCK_IMAGE_REFERENCE:?set the pinned Ed-Fi API image reference, version-specific tag plus digest}
