# Test-owned, and the harness's own copy of the small override eng/docker-compose/README.md tells an
# operator to write.
#
# Acquiring a plugin's bytes and allowing it to load are separate decisions. Neither acquisition
# overlay writes Plugins:Allowed, so a deployment that mounts a plugin root and nothing else loads
# nothing from it. This is the other half.
#
# Driven by a variable rather than a literal only because the harness runs the same file twice,
# once naming the fixture and once with the allowlist empty, to prove that the second boot is
# otherwise identical. An operator's own copy would carry the name directly.
services:
  dms:
    environment:
      Plugins__Allowed: ${DMS_PLUGINS_ALLOWED:-}
