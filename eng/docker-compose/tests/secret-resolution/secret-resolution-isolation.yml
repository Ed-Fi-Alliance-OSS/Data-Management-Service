# The secret-resolution end-to-end harness's own deployment: the stock database, Configuration
# Service and DMS services, renamed onto their own network so the harness can run beside any other
# local stack. Only names change. Hostnames stay as the base files set them, because they are per
# network, so every in-container URL and connection string the base files and .env.e2e use still
# resolves. Composed after postgresql.yml, local-config.yml, local-dms.yml and plugins-config.yml by
# Invoke-SecretResolutionE2E.ps1, which supplies every variable below.
services:
  db:
    container_name: ${SECRETS_E2E_POSTGRES_CONTAINER:?}
  config:
    container_name: ${SECRETS_E2E_CONFIG_CONTAINER:?}
    environment:
      # Enabling the mounted plugin is the deployment's decision, separate from acquiring it.
      Plugins__Allowed: Acme.FileSecretResolver
      AcmeFileSecrets__Path: /secrets/secrets.json
    volumes:
      # The directory rather than the file, so a rewrite by rename is seen by the container.
      - ${SECRETS_E2E_SECRETS_DIRECTORY:?}:/secrets:ro
  dms:
    container_name: ${SECRETS_E2E_DMS_CONTAINER:?}

networks:
  dms:
    name: ${SECRETS_E2E_NETWORK:?}
    external: true
