services:
  kafka:
    image: apache/kafka:3.9.0@sha256:fbc7d7c428e3755cf36518d4976596002477e4c052d1f80b5b9eafd06d0fff2f
    container_name: dms-kafka1
    # Docker creates this new volume mount as root; initialize only its directory,
    # then run the image's normal startup as the unprivileged Kafka user.
    user: root
    command:
      - /bin/sh
      - -c
      - chown appuser:appuser /tmp/kraft-combined-logs && exec su appuser -s /bin/sh -c 'exec /etc/kafka/docker/run'
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
      - kafka-logs:/kafka/logs
    restart: unless-stopped
    healthcheck:
      test: /opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server dms-kafka1:9092 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      # Pin the path: this image's environment-based startup otherwise uses /tmp/kafka-logs.
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://dms-kafka1:9092
      KAFKA_LISTENERS: PLAINTEXT://dms-kafka1:9092,CONTROLLER://dms-kafka1:9093
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@dms-kafka1:9093
      # Default values for the following environment variables:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    ports:
      - '127.0.0.1:${KAFKA_PORT:-9092}:9092'
    networks:
      - dms
    hostname: dms-kafka1
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"

networks:
  dms:
    external: true

volumes:
  kafka-data:
  kafka-logs:
