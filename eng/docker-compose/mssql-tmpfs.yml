services:
  db:
    environment:
      MSSQL_AGENT_ENABLED: ${MSSQL_AGENT_ENABLED:-true}
    mem_limit: ${MSSQL_CONTAINER_MEMORY:-10g}
    memswap_limit: ${MSSQL_CONTAINER_MEMORY:-10g}
    tmpfs:
      - /var/opt/mssql:rw,size=${MSSQL_TMPFS_SIZE:-4g},mode=1777
    volumes: !override []
