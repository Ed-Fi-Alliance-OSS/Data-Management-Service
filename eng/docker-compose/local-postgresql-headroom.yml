# DMS-1556 investigation: separately labeled connection-headroom experiment. The ONLY
# change against its matched baseline is PostgreSQL max_connections=200 (default 100),
# so a 100-connection CMS pool no longer exhausts server slots (53300). Apply AFTER
# local-postgresql-diagnostics.yml: compose replaces `command` wholesale, so every
# diagnostics flag and the base max_locks_per_transaction=256 are restated here.
services:
  db:
    command:
      - postgres
      - -c
      - max_locks_per_transaction=256
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_min_duration_statement=250
      - -c
      - log_lock_waits=on
      - -c
      - log_checkpoints=on
      - -c
      - max_connections=200
