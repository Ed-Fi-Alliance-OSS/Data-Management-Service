services:
  kafka:
    image: apache/kafka:3.9.0@sha256:fbc7d7c428e3755cf36518d4976596002477e4c052d1f80b5b9eafd06d0fff2f
    container_name: dms-kafka1
    volumes:
      - kafka-data:/kafka/data
      - kafka-logs:/kafka/logs
    restart: unless-stopped
    healthcheck:
      test: /opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server dms-kafka1:9092 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://dms-kafka1:9092
      KAFKA_LISTENERS: PLAINTEXT://dms-kafka1:9092,CONTROLLER://dms-kafka1:9093
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@dms-kafka1:9093
      # Default values for the following environment variables:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    ports:
      - '127.0.0.1:${KAFKA_PORT:-9092}:9092'
    networks:
      - dms
    hostname: dms-kafka1
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"

  # The Kafka Connect worker. Its name predates the engine-neutral CDC workflow and is kept: a
  # rename would break existing local workflows and any external reference to the container name.
  # Nothing in the worker is PostgreSQL-specific - it hosts whichever Debezium connector the CDC
  # control plane registers, PostgreSQL or SQL Server - so the one service serves both engines.
  kafka-postgresql-source:
    # The CDC workflow requires an operator-supplied image identified by immutable digest and
    # rejects a tag before Compose is invoked (start-local-dms.ps1, -EnableKafkaCdc); the :pre
    # default is retained for the non-CDC Kafka/Kafka-UI path so current workflows are untouched.
    image: ${DMS_CDC_CONNECT_IMAGE:-edfialliance/ed-fi-kafka-connect:pre}
    container_name: kafka-postgresql-source
    volumes:
      - kafka-postgresql-source-logs:/kafka/logs
      - kafka-postgresql-source-config:/kafka/config
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: dms-kafka1:9092
      # The worker group and its shared offset store are also named by the CDC control plane
      # (DataManagement__DocumentCache__Cdc__ConnectWorkerKey / __ConnectOffsetStorageTopic in
      # cdc-setup.yml), so both read the same variables and cannot drift from what it validates.
      GROUP_ID: ${DMS_CDC_CONNECT_WORKER_KEY:-1}
      CONFIG_STORAGE_TOPIC: debezium_source_config
      OFFSET_STORAGE_TOPIC: ${DMS_CDC_CONNECT_OFFSET_STORAGE_TOPIC:-debezium_source_offset}
      STATUS_STORAGE_TOPIC: debezium_source_status
      # The JMX-over-HTTP bridge the connector source-lag reading is taken from. The Debezium base
      # image ships the Jolokia agent and its entrypoint hardcodes port 8778, so the port is a
      # property of the image rather than a setting. ENABLE_JMX_EXPORTER is not an alternative on
      # this image: its entrypoint branch targets 9404 but no jmx_prometheus_javaagent jar ships.
      ENABLE_JOLOKIA: 'true'
    ports:
      - '127.0.0.1:${CONNECT_SOURCE_PORT:-8083}:8083'
      - '127.0.0.1:${CONNECT_JOLOKIA_PORT:-8778}:8778'
    networks:
      - dms
    hostname: kafka-postgresql-source
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"

networks:
  dms:
    external: true

volumes:
  kafka-data:
  kafka-logs:
  kafka-postgresql-source-logs:
  kafka-postgresql-source-config:
