name: Build Populated Template Package

on:
  workflow_call:
    inputs:
      standard_version:
        description: "Ed-Fi Data Standard version"
        required: true
        type: string
      package_name:
        description: "Package name"
        required: true
        type: string
      manifest_file:
        description: "Manifest file path"
        required: true
        type: string
      provenance_file:
        description: "Provenance file name"
        required: true
        type: string
      publish_package:
        description: "Publish the built populated template package to the Azure Artifacts feed"
        required: false
        type: boolean
        default: true
      environment_file:
        description: "Docker compose environment file used to start/provision the stack"
        required: false
        type: string
        default: "./.env.template"
      verify_restore:
        description: "Run template package restore verification"
        required: false
        type: boolean
        default: false
      require_populated_data:
        description: "Require populated data during restore verification"
        required: false
        type: boolean
        default: false
      # The built package's data dump is coupled to an engine image line: the mssql .bak
      # backup is coupled to the mcr.microsoft.com/mssql/server:2025-latest image used to create
      # and restore it (a moving tag tracking the latest SQL Server 2025 build; the coupling is
      # at the SQL Server 2025 level, not an exact build), the same way the postgresql .sql dump
      # is coupled to the PostgreSQL major version it was built and restored against.
      database_engine:
        description: "Database engine for the relational template datastore (postgresql or mssql)"
        required: false
        type: string
        default: "postgresql"
    secrets:
      AZURE_ARTIFACTS_PERSONAL_ACCESS_TOKEN:
        required: true
      AZURE_ARTIFACTS_USER_NAME:
        # Consumed only on the release-promotion path (env.ARTIFACTS_USERNAME); restore uses the PAT
        # alone. Optional so non-publishing callers and forks without the secret do not hard-fail.
        required: false
      TEMPLATE_ATTESTATION_PRIVATE_KEY:
        # PKCS#8 ECDSA P-256 private key (PEM) for the 'edfi-alliance-ci' trust-policy
        # producer. Optional: without it the build is UNATTESTED (loud notice) and restore
        # consumers refuse the published package (fail-closed). Callers pass it by name. It must
        # exist ONLY as a secret of the 'template-attestation-signing' environment, never as a
        # repository or organization secret, because the ref check in this workflow is not a
        # security boundary: a ref name such as refs/tags/v* does not show that its commit was
        # reviewed. GitHub releases an environment secret only after the environment's
        # protection rules pass, so an administrator configures that environment, before
        # installing the key, with required reviewers (self-review prevented), deployment refs
        # limited to main and the release tag pattern, and an enforced tag ruleset that lets
        # only authorized release maintainers create, update, or delete release tags; reviewers
        # approve a signing deployment only after verifying that its commit is approved.
        # Generate with eng/DatabaseTemplates/new-template-dev-trust.ps1 -Purpose CI; the
        # matching public key belongs in eng/docker-compose/template-trust-policy.json via a
        # reviewed commit.
        required: false
      SLACK_WEBHOOK_URL:
        required: false
    outputs:
      hash-code:
        description: "Hash code of the built package"
        value: ${{ jobs.build-template.outputs.hash-code }}
      dms-version:
        description: "DMS version"
        value: ${{ jobs.build-template.outputs.dms-version }}
      sbom-hash-code:
        description: "SBOM hash code"
        value: ${{ jobs.generate-package-sbom.outputs.sbom-hash-code }}

env:
  ARTIFACTS_FEED_URL: ${{ vars.AZURE_ARTIFACTS_FEED_URL }}
  ARTIFACTS_PACKAGES_URL: ${{ vars.ARTIFACTS_PACKAGES_URL }}
  ARTIFACTS_USERNAME: ${{ secrets.AZURE_ARTIFACTS_USER_NAME }}
  ARTIFACTS_API_KEY: ${{ secrets.AZURE_ARTIFACTS_PERSONAL_ACCESS_TOKEN }}
  VSS_NUGET_EXTERNAL_FEED_ENDPOINTS: '{"endpointCredentials": [{"endpoint": "https://pkgs.dev.azure.com/ed-fi-alliance/Ed-Fi-Alliance-OSS/_packaging/EdFi/nuget/v3/index.json","password": "${{ secrets.AZURE_ARTIFACTS_PERSONAL_ACCESS_TOKEN }}"}]}'

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  build-template:
    name: Build Populated Template Package
    if: ${{ github.event_name != 'release' }}
    # The template is generated, verified, and packed here, on a runner that never holds the
    # signing key: this job has no environment, so the CI key (an environment secret of
    # 'template-attestation-signing') is unreachable. sign-template-package attests the
    # packed bytes afterwards on a fresh runner.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      hash-code: ${{ steps.hash-code.outputs.hash-code }}
      dms-version: ${{ steps.versions.outputs.dms-v }}
      package-version: ${{ steps.package-identity.outputs.package-version }}
      package-sha256: ${{ steps.package-identity.outputs.package-sha256 }}
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A tag push builds, publishes and attaches release assets from this job's outputs, and every
      # job that reads the tag name follows it by needs. A tag that is not a v version stops here.
      - name: Validate the release tag
        if: ${{ github.ref_type == 'tag' }}
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          Import-Module ./eng/ci/release-classification.psm1
          Assert-ReleaseRef -ReleaseRef $env:RELEASE_REF -Prefix v

      - name: Validate workflow inputs
        env:
          STANDARD_VERSION: ${{ inputs.standard_version }}
          DATABASE_ENGINE: ${{ inputs.database_engine }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          TEMPLATE_ENV_PATH: ${{ inputs.environment_file }}
          PUBLISH_PACKAGE: ${{ inputs.publish_package }}
          VERIFY_RESTORE: ${{ inputs.verify_restore }}
          REQUIRE_POPULATED_DATA: ${{ inputs.require_populated_data }}
        run: |
          ./eng/DatabaseTemplates/Assert-TemplateWorkflowInputs.ps1 `
            -WorkflowKind Populated `
            -StandardVersion $env:STANDARD_VERSION `
            -PackageName $env:PACKAGE_NAME `
            -EnvironmentFile $env:TEMPLATE_ENV_PATH `
            -DatabaseEngine $env:DATABASE_ENGINE `
            -PublishPackage ([bool]::Parse($env:PUBLISH_PACKAGE)) `
            -VerifyRestore ([bool]::Parse($env:VERIFY_RESTORE)) `
            -RequirePopulatedData ([bool]::Parse($env:REQUIRE_POPULATED_DATA))

      - name: Checkout Ed-Fi-Data-Standard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Ed-Fi-Alliance-OSS/Ed-Fi-Data-Standard
          path: Ed-Fi-Data-Standard/
          ref: v${{ inputs.standard_version }} # Added v prefix to match the tag format

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Resolve template database name
        run: |
          Import-Module ./env-utility.psm1 -Force
          $envValues = ReadValuesFromEnvFile "${{ inputs.environment_file }}"
          $templateDatabaseName = [string]$envValues["E2E_DATABASE_NAME"]
          if ([string]::IsNullOrWhiteSpace($templateDatabaseName)) {
            throw "E2E_DATABASE_NAME must be set in ${{ inputs.environment_file }}"
          }
          "TEMPLATE_DB_NAME=$templateDatabaseName" | Out-File -FilePath $env:GITHUB_ENV -Append
        working-directory: eng/docker-compose/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('src/Directory.Packages.props', 'src/dms/Dockerfile', 'src/dms/**') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build DMS Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          load: true
          context: ./src/dms
          file: ./src/dms/Dockerfile
          build-contexts: |
            parentdir=./src
          push: false
          tags: ed-fi-api-local:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

      - name: Set Version Numbers
        id: versions
        run: |
          Import-Module ./package-helpers.psm1
          Get-VersionNumber -projectPrefix "dms" # Match the DMS version

      - name: Start DMS infrastructure
        run: |
          $env:LOG_LEVEL="Warning"
          ./start-local-dms.ps1 -EnvironmentFile "${{ inputs.environment_file }}" -EnableConfig -InfraOnly -DatabaseEngine "${{ inputs.database_engine }}"
        working-directory: eng/docker-compose/

      # No data store is created by default; register the template data store before
      # DMS starts and hand its id forward. The Configuration Service protects connection
      # strings in API responses, so the id from registration is the only reliable way to
      # select this data store later.
      - name: Register template data store
        run: |
          Import-Module ../Dms-Management.psm1 -Force
          Import-Module ./env-utility.psm1 -Force
          # The SQL Server container was started from the composed engine env file (base +
          # .env.mssql overlay), so credentials must be read from that same composed file,
          # not the base file.
          $effectiveEnvironmentFile = Resolve-DatabaseEngineEnvironmentFile -DatabaseEngine "${{ inputs.database_engine }}" -BaseEnvironmentFile "${{ inputs.environment_file }}" -DockerComposeRoot (Resolve-Path ".").Path
          $envValues = ReadValuesFromEnvFile $effectiveEnvironmentFile
          $postgresUser = Get-EnvValue -EnvValues $envValues -Name "POSTGRES_USER" -DefaultValue "postgres"
          $postgresCredential = ConvertTo-PostgresCredential -UserName $postgresUser -Secret $envValues.POSTGRES_PASSWORD

          # Add-DataStore always requires a PostgresCredential; for mssql it goes unused
          # because -ConnectionString is supplied verbatim below. On the mssql leg the
          # Configuration Service also runs on SQL Server (shared-database topology; no
          # PostgreSQL container exists), so the credential is a required-parameter placeholder
          # there, built from env values that are present in the template env file either way.
          $dataStoreConnectionString = ""
          if ("${{ inputs.database_engine }}" -eq "mssql") {
            $mssqlPassword = Get-EnvValue -EnvValues $envValues -Name "MSSQL_SA_PASSWORD" -DefaultValue "abcdefgh1!"
            $dataStoreConnectionString = New-DataStoreConnectionString -DatabaseEngine "mssql" -DbHost "dms-mssql" -Port 1433 -Username "sa" -Password $mssqlPassword -DatabaseName $env:TEMPLATE_DB_NAME
          }

          Add-CmsClient -CmsUrl "http://localhost:8081" -ClientId "data-store-admin" -ClientSecret "ValidClientSecret1234567890!Abcd" -DisplayName "Data Store Setup Administrator"
          $configToken = Get-CmsToken -CmsUrl "http://localhost:8081" -ClientId "data-store-admin" -ClientSecret "ValidClientSecret1234567890!Abcd"
          $dataStoreId = Add-DataStore -CmsUrl "http://localhost:8081" -AccessToken $configToken -PostgresCredential $postgresCredential -PostgresDbName $env:TEMPLATE_DB_NAME -ConnectionString $dataStoreConnectionString -DatabaseEngine "${{ inputs.database_engine }}" -Name "Template Data Store" -DataStoreType "Template"
          if (-not $dataStoreId) {
            throw "Failed to register the template data store."
          }
          "TEMPLATE_DATA_STORE_ID=$dataStoreId" | Out-File -FilePath $env:GITHUB_ENV -Append
        working-directory: eng/docker-compose/

      - name: Provision template database
        run: |
          ./provision-e2e-database.ps1 -EnvironmentFile "${{ inputs.environment_file }}" -Configuration Release -DatabaseEngine "${{ inputs.database_engine }}" -SchemaOutputDirectory "${{ github.workspace }}/template-evidence/schema"
        working-directory: eng/docker-compose/

      - name: Start DMS Docker
        run: |
          $env:LOG_LEVEL="Warning"
          ./start-local-dms.ps1 -EnvironmentFile "${{ inputs.environment_file }}" -EnableConfig -DmsOnly -DatabaseEngine "${{ inputs.database_engine }}"
        working-directory: eng/docker-compose/

      - name: Wait for DMS to be ready
        run: |
          $maxAttempts = 30
          $attempt = 0
          $ready = $false

          while (-not $ready -and $attempt -lt $maxAttempts) {
            $attempt++
            Write-Host "Waiting for DMS to be ready (attempt $attempt/$maxAttempts)..."

            try {
              $response = Invoke-WebRequest -Uri "http://localhost:8080/metadata/specifications/resources-spec.json" -Method Get -TimeoutSec 5 -ErrorAction Stop
              if ($response.StatusCode -eq 200) {
                $ready = $true
                Write-Host "DMS is ready!"
              }
            }
            catch {
              Write-Host "DMS not ready yet: $_"
              Start-Sleep -Seconds 10
            }
          }

          if (-not $ready) {
            throw "DMS did not become ready within the timeout period"
          }

      # Generation and packing run without signing credentials; the next step attests the
      # completed package.
      - name: Generate Populated Template package
        run: |
          Import-Module ./Template-Management.psm1 -Force

          # The producer compares the source database with the DDL of the schema files it was
          # provisioned from, so resolve the same SCHEMA_PACKAGES set the provision step used.
          Import-Module ../schema-package-utility.psm1 -Force
          $schemaFiles = @(Resolve-SchemaFilesFromEnvironmentFile `
                  -EnvironmentFilePath '../docker-compose/${{ inputs.environment_file }}' `
                  -Configuration Release `
                  -RepoRoot '${{ github.workspace }}' `
                  -SchemaDirectory (Join-Path $env:RUNNER_TEMP 'template-source-schema') `
                  -DownloaderDotnetRunArgs @('--no-launch-profile'))

          # Generate unique application name for this run
          $uniqueAppName = "Demo application ${{ github.run_id }}"

          $packageVersion = "${{ steps.versions.outputs.dms-semver }}" -replace "dms-v", ""
          Build-Template `
                  -TemplateType Populated `
                  -DmsUrl 'http://localhost:8080' `
                  -CmsUrl 'http://localhost:8081' `
                  -MinimalSampleDataDirectory '${{ github.workspace }}/Ed-Fi-Data-Standard/Descriptors' `
                  -PopulatedSampleDataDirectory '${{ github.workspace }}/Ed-Fi-Data-Standard/Samples/Sample XML' `
                  -Extension 'ed-fi' `
                  -ConfigFilePath './PopulatedTemplateSettings.psd1' `
                  -StandardVersion '${{ inputs.standard_version }}' `
                  -PackageVersion $packageVersion `
                  -ApplicationName $uniqueAppName `
                  -DataStoreDatabaseName $env:TEMPLATE_DB_NAME `
                  -DataStoreId $env:TEMPLATE_DATA_STORE_ID `
                  -DumpAllUserSchemas `
                  -DatabaseEngine '${{ inputs.database_engine }}' `
                  -SchemaFilePath $schemaFiles
        working-directory: eng/DatabaseTemplates/

      # Signing never runs in this job. The job-level gate on sign-template-package decides
      # whether the packed template is attested; this step only says loudly when it will not
      # be, because restore consumers refuse an unattested package (fail-closed).
      - name: Report template signing plan
        env:
          SIGNING_ELIGIBLE: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          SIGNING_ENABLED: ${{ vars.TEMPLATE_ATTESTATION_SIGNING_ENABLED == 'true' }}
        run: |
          if ($env:SIGNING_ELIGIBLE -ne 'true') {
            Write-Host "::notice title=Unattested template build::Only main and v*.*.* tag runs (never pull requests) sign template packages; this template package will be UNATTESTED and restore consumers will refuse it (fail-closed)."
          }
          elseif ($env:SIGNING_ENABLED -ne 'true') {
            Write-Host "::notice title=Unattested template build::The TEMPLATE_ATTESTATION_SIGNING_ENABLED repository variable is not 'true', so signing is skipped; this template package will be UNATTESTED and restore consumers will refuse it (fail-closed)."
          }
          else {
            Write-Host "sign-template-package attests this template package after the build, on a separate runner."
          }

      # A loader that exits 0 does not guarantee it wrote anything: gate on populated content
      # here, before the package is uploaded or published, so an empty bulk load cannot slip
      # through as a "populated" template. This runs unconditionally (unlike the opt-in
      # verify-restore step below, which validates the restored package instead).
      - name: Gate on populated content before upload
        env:
          DATABASE_ENGINE: ${{ inputs.database_engine }}
        run: |
          if ($env:DATABASE_ENGINE -eq "mssql") {
            $query = "SET NOCOUNT ON; SELECT COUNT(*) FROM [edfi].[School];"
            # Read MSSQL_SA_PASSWORD from the container environment so the gate uses the exact
            # credential Docker Compose started SQL Server with, without placing it in host or
            # container process arguments.
            $rawOutput = & docker exec dms-mssql /bin/bash -c 'export SQLCMDPASSWORD="$MSSQL_SA_PASSWORD"; exec "$@"' -- /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -d $env:TEMPLATE_DB_NAME -C -b -h -1 -W -Q $query
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to query edfi.School row count from database '$($env:TEMPLATE_DB_NAME)'."
            }
            $schoolCount = [long](@($rawOutput) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -First 1)

            # Verify (never set) the supported-runtime baseline: newly created databases on
            # SQL Server 2025 default to compatibility level 170. Templates restored from
            # 2022-built packages intentionally keep their original level, so this check only
            # applies to a freshly built template like this one.
            $compatQuery = "SET NOCOUNT ON; SELECT compatibility_level FROM sys.databases WHERE name = N'$($env:TEMPLATE_DB_NAME)';"
            $rawCompatOutput = & docker exec dms-mssql /bin/bash -c 'export SQLCMDPASSWORD="$MSSQL_SA_PASSWORD"; exec "$@"' -- /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -d $env:TEMPLATE_DB_NAME -C -b -h -1 -W -Q $compatQuery
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to query compatibility_level from database '$($env:TEMPLATE_DB_NAME)'."
            }
            $compatibilityLevel = [long](@($rawCompatOutput) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -First 1)
            if ($compatibilityLevel -ne 170) {
              throw "Compatibility level gate failed: database '$($env:TEMPLATE_DB_NAME)' is at compatibility level $compatibilityLevel, expected 170 (SQL Server 2025 default for newly created databases)."
            }
            Write-Host "Compatibility level gate passed: database '$($env:TEMPLATE_DB_NAME)' is at compatibility level $compatibilityLevel." -ForegroundColor Green
          }
          else {
            $rawOutput = & docker exec dms-postgresql psql -U postgres -d $env:TEMPLATE_DB_NAME -tA -c 'SELECT COUNT(*) FROM edfi."School";'
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to query edfi.School row count from database '$($env:TEMPLATE_DB_NAME)'."
            }
            $schoolCount = [long](@($rawOutput) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -First 1)
          }

          if ($schoolCount -lt 1) {
            throw "Populated content gate failed: edfi.School has $schoolCount row(s) in database '$($env:TEMPLATE_DB_NAME)'; the bulk load did not populate sample data."
          }

          Write-Host "Populated content gate passed: edfi.School has $schoolCount row(s)." -ForegroundColor Green
        working-directory: eng/docker-compose/

      - name: Verify template package restore
        if: ${{ inputs.verify_restore }}
        run: |
          $evidenceDirectory = "${{ github.workspace }}/template-evidence"
          $dialect = if ('${{ inputs.database_engine }}' -eq 'mssql') { 'mssql' } else { 'pgsql' }
          $modelManifest = Join-Path $evidenceDirectory "schema/relational-model.$dialect.manifest.json"
          # Validate the full implementation baseline and retain the exact SQL used by both gates.
          ./Assert-TemplateSchema.ps1 -ExpectedModelManifestPath $modelManifest -DatabaseEngine '${{ inputs.database_engine }}' -RenderSql |
            Set-Content (Join-Path $evidenceDirectory 'catalog-assertions.sql')
          $packages = @(Get-ChildItem -LiteralPath . -Filter '*.nupkg' | Where-Object { $_.Name -notlike '*.Attestation.*' })
          if ($packages.Count -ne 1) { throw "Expected exactly one template package for this leg." }
          $engineContainer = if ($dialect -eq 'mssql') { 'dms-mssql' } else { 'dms-postgresql' }
          $engineImage = & docker inspect $engineContainer --format '{{.Config.Image}} {{.Image}}'
          if ($LASTEXITCODE -ne 0) { throw "Could not record the database engine image." }
          $evidence = [ordered]@{
            producing_commit = (git rev-parse HEAD)
            build_run = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            build_attempt = '${{ github.run_attempt }}'
            database_engine = '${{ inputs.database_engine }}'
            engine_image = $engineImage
            standard_version = '${{ inputs.standard_version }}'
            environment_file = '${{ inputs.environment_file }}'
            package_id = '${{ inputs.package_name }}'
            package_version = ('${{ steps.versions.outputs.dms-semver }}' -replace 'dms-v', '')
            package_file = $packages[0].Name
            package_sha256 = (Get-FileHash $packages[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            manifest_file = "schema/relational-model.$dialect.manifest.json"
            manifest_sha256 = (Get-FileHash $modelManifest -Algorithm SHA256).Hash.ToLowerInvariant()
            require_populated_data = [bool]::Parse('${{ inputs.require_populated_data }}')
            verification = 'failed'
          }
          $verifyParams = @{
            SourceDatabaseName = $env:TEMPLATE_DB_NAME
            DatabaseEngine = '${{ inputs.database_engine }}'
            ExpectedTemplateKind = 'Populated'
            ExpectedModelManifestPath = $modelManifest
          }
          if ([bool]::Parse('${{ inputs.require_populated_data }}')) {
            $verifyParams.RequirePopulatedData = $true
          }
          Start-Transcript -Path (Join-Path $evidenceDirectory 'verification.log')
          try {
            ./verify-template-restore.ps1 @verifyParams
            $evidence.verification = 'passed'
          }
          finally {
            Stop-Transcript
            $evidence | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $evidenceDirectory 'verification.json')
          }
        working-directory: eng/DatabaseTemplates/

      - name: Upload template schema and verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ inputs.package_name }}-Verification"
          path: ${{ github.workspace }}/template-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Bulk Load Logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Bulkload-logs-${{ inputs.package_name }}
          path: ${{ github.workspace }}/eng/DatabaseTemplates/.packages/**/logfile.txt
          retention-days: 10

      - name: Export Docker Logs
        if: failure()
        run: |
          $logDir = "${{ github.workspace }}/logs"
          New-Item -ItemType Directory -Path $logDir -Force | Out-Null

          docker ps --format "{{.Names}}" | ForEach-Object {
              $container = $_
              $logPath = Join-Path $logDir "$container.log"
              docker logs $container > $logPath
          }
        shell: pwsh

      - name: Upload Docker Logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Docker-Logs-${{ inputs.package_name }}
          path: ${{ github.workspace }}/logs
          retention-days: 10

      - name: Generate hash for NuGet package
        id: hash-code
        run: |
          "hash-code=$(sha256sum *.nupkg | base64 -w0)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        working-directory: eng/DatabaseTemplates/

      # The signing job attests only these bytes: it compares the downloaded package with this
      # hash before and after signing.
      - name: Record template package identity
        id: package-identity
        run: |
          $packages = @(Get-ChildItem -LiteralPath . -Filter '*.nupkg')
          if ($packages.Count -ne 1) {
            throw "Expected exactly one template package to hand to signing; found $($packages.Count)."
          }
          "package-version=$('${{ steps.versions.outputs.dms-semver }}' -replace 'dms-v', '')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "package-sha256=$((Get-FileHash -LiteralPath $packages[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        working-directory: eng/DatabaseTemplates/

      - name: Upload Populated Template Package as Artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ inputs.package_name }}-NuGet"
          path: |
            ${{ github.workspace }}/eng/DatabaseTemplates/*.nupkg
          if-no-files-found: error
          retention-days: 30

  generate-package-sbom:
    name: Create Populated Template SBOM
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    needs: build-template
    permissions:
      actions: read
      contents: write
    outputs:
      sbom-hash-code: ${{ steps.sbom-hash-code.outputs.sbom-hash-code }}
    steps:
      - name: Get Populated Template Package Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.package_name }}-NuGet

      - name: Generate Populated Template Software Bill of Materials (SBOM)
        run: |
          $packageName = "${{ inputs.package_name }}"
          $version = "${{ needs.build-template.outputs.dms-version }}"

          Get-ChildItem -Include "$packageName.*.nupkg" -Recurse | ForEach-Object { $_.FullName } > buildfilelist.txt

          dotnet tool install --global Microsoft.Sbom.DotNetTool

          sbom-tool generate `
              -b ./ `
              -bl ./buildfilelist.txt `
              -bc "./" `
              -pn "$packageName" `
              -pv $version `
              -nsb https://ed-fi.org `
              -m ./ `
              -ps "Ed-Fi Alliance"

          cp _manifest/spdx_2.2/manifest.spdx.* .

      - name: Upload Populated Template SBOM
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.package_name }}-SBOM
          path: ${{ inputs.manifest_file }}
          if-no-files-found: error
          retention-days: 30

      - name: Generate Populated Template SBOM Hash Code
        id: sbom-hash-code
        shell: bash
        run: |
          # sha256sum returns "<hashcode>  <name of file". Split that and return only the <hashcode>.
          sbom_hash=$(sha256sum "./${{ inputs.manifest_file }}" | awk '{split($0,a); print a[1]}')
          echo "sbom-hash-code=$sbom_hash" >> "$GITHUB_OUTPUT"

  generate-package-provenance:
    name: Create DMS Provenance
    needs: build-template
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: Ed-Fi-Alliance-OSS/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.build-template.outputs.hash-code }}
      provenance-name: ${{ inputs.provenance_file }}
      upload-assets: false
      # TODO: remove this after this issue is resolved: https://github.com/slsa-framework/slsa-github-generator/issues/876
      compile-generator: true

  # Signing is requested only for main pushes and dispatches and v*.*.* tag refs, never for
  # pull_request, and only while the non-secret repository variable
  # TEMPLATE_ATTESTATION_SIGNING_ENABLED is 'true'. The variable is a configuration gate, not a
  # trust decision: an intentionally unsigned run skips this job entirely instead of waiting for
  # an environment approval, and a run that cannot sign fails here rather than publishing
  # unattested. Matching a ref name is not enough to authorize signing either. The boundary is
  # the environment's protection rules (required reviewers without self-review,
  # deployment-ref restrictions, an enforced release-tag ruleset, and reviewer verification that
  # the commit is approved), which GitHub checks before releasing the secret and which pull
  # request code cannot edit. Approval applies to this whole job, so it runs on a fresh runner
  # that only downloads the packed template and attests those exact bytes: it runs no template
  # build, database artifact, dependency restore, or package packing.
  sign-template-package:
    name: Sign Populated Template Package
    needs: build-template
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && vars.TEMPLATE_ATTESTATION_SIGNING_ENABLED == 'true' }}
    environment: template-attestation-signing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Populated Template Package Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.package_name }}-NuGet
          path: eng/DatabaseTemplates/

      # The key file lands under RUNNER_TEMP, is created owner-only (0600) before any key byte
      # is written, and is removed in finally whether signing succeeds or fails. The package is
      # hashed against build-template's record before signing and again after it, and the
      # attestation must bind that same hash, so the signed bytes are the built bytes.
      - name: Attest template package
        id: attestation-signer
        env:
          TEMPLATE_ATTESTATION_PRIVATE_KEY: ${{ secrets.TEMPLATE_ATTESTATION_PRIVATE_KEY }}
          EXPECTED_PACKAGE_SHA256: ${{ needs.build-template.outputs.package-sha256 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TEMPLATE_ATTESTATION_PRIVATE_KEY)) {
            throw "TEMPLATE_ATTESTATION_SIGNING_ENABLED is 'true' but TEMPLATE_ATTESTATION_PRIVATE_KEY is not configured in the 'template-attestation-signing' environment; refusing to continue without signing. Install the key, or clear the variable for unattested builds."
          }

          Import-Module ./Template-Management.psm1 -Force
          $config = Get-TemplatePackageConfig -ConfigFilePath './PopulatedTemplateSettings.psd1' -StandardVersion '${{ inputs.standard_version }}' -DatabaseEngine '${{ inputs.database_engine }}'
          $packageVersion = '${{ needs.build-template.outputs.package-version }}'
          $packageFileName = "$($config.Id).$packageVersion.nupkg"

          $packages = @(Get-ChildItem -LiteralPath . -Filter '*.nupkg')
          if ($packages.Count -ne 1 -or $packages[0].Name -cne $packageFileName) {
            throw "Expected exactly the template package '$packageFileName' from build-template; found: $(@($packages.Name) -join ', ')."
          }
          $packageSha256 = (Get-FileHash -LiteralPath $packages[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($packageSha256 -cne $env:EXPECTED_PACKAGE_SHA256) {
            throw "The downloaded template package does not match the bytes build-template packed; refusing to sign it."
          }

          $signerKeyPath = Join-Path $env:RUNNER_TEMP "template-attestation-signer.pem"
          try {
            # CreateNew with an owner-only mode: the file is 0600 from creation, before any key
            # byte is written, and a file already at that path is refused.
            $keyFileOptions = [System.IO.FileStreamOptions]@{
              Mode   = [System.IO.FileMode]::CreateNew
              Access = [System.IO.FileAccess]::Write
            }
            $keyFileOptions.UnixCreateMode = [System.IO.UnixFileMode]'UserRead, UserWrite'
            $keyFile = [System.IO.FileStream]::new($signerKeyPath, $keyFileOptions)
            try {
              $keyBytes = [System.Text.UTF8Encoding]::new($false).GetBytes($env:TEMPLATE_ATTESTATION_PRIVATE_KEY)
              $keyFile.Write($keyBytes, 0, $keyBytes.Length)
            }
            finally {
              $keyFile.Dispose()
            }

            $attestationPath = Write-TemplatePackageAttestation `
                    -Config $config `
                    -PackageVersion $packageVersion `
                    -BackupDirectory './' `
                    -AttestationSignerKeyPath $signerKeyPath `
                    -AttestationProducer 'edfi-alliance-ci'
          }
          finally {
            if (Test-Path -LiteralPath $signerKeyPath) {
              Remove-Item -LiteralPath $signerKeyPath -Force
            }
          }

          if ((Get-FileHash -LiteralPath $packages[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $packageSha256) {
            throw "The template package changed while it was attested; refusing to hand on the attestation."
          }
          $attestation = Get-Content -LiteralPath $attestationPath -Raw | ConvertFrom-Json
          $payload = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String([string]$attestation.payloadB64)) | ConvertFrom-Json
          if ([string]$payload.packageSha256 -cne $packageSha256) {
            throw "The attestation does not bind the template package bytes build-template packed."
          }
        working-directory: eng/DatabaseTemplates/

      # Backstop for a runner that stops the signing step before its finally runs.
      - name: Remove attestation signing key
        if: always()
        run: |
          $signerKeyPath = Join-Path $env:RUNNER_TEMP "template-attestation-signer.pem"
          if (Test-Path -LiteralPath $signerKeyPath) {
            Remove-Item -LiteralPath $signerKeyPath -Force
          }

      - name: Upload template attestation document
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ inputs.package_name }}-AttestationDocument"
          path: ${{ github.workspace }}/eng/DatabaseTemplates/*.nupkg.attestation.json
          if-no-files-found: error
          retention-days: 30

  # The companion attestation package runs dotnet restore and dotnet pack, so it is built on its
  # own runner, which never receives the signing key, from the signed attestation document.
  build-attestation-companion:
    name: Build Populated Template Attestation Companion
    needs:
      - build-template
      - sign-template-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Get template attestation document
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.package_name }}-AttestationDocument
          path: eng/DatabaseTemplates/

      - name: Build attestation companion package
        run: |
          Import-Module ./Template-Management.psm1 -Force
          $config = Get-TemplatePackageConfig -ConfigFilePath './PopulatedTemplateSettings.psd1' -StandardVersion '${{ inputs.standard_version }}' -DatabaseEngine '${{ inputs.database_engine }}'
          $packageVersion = '${{ needs.build-template.outputs.package-version }}'
          $attestationPath = Join-Path (Resolve-Path -LiteralPath .).ProviderPath "$($config.Id).$packageVersion.nupkg.attestation.json"
          Build-TemplateAttestationCompanionPackage `
                  -Config $config `
                  -PackageVersion $packageVersion `
                  -BackupDirectory './' `
                  -AttestationPath $attestationPath | Out-Null
        working-directory: eng/DatabaseTemplates/

      - name: Upload attestation companion package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ inputs.package_name }}-Attestation"
          path: |
            ${{ github.workspace }}/eng/DatabaseTemplates/*.nupkg
            ${{ github.workspace }}/eng/DatabaseTemplates/*.nupkg.attestation.json
          if-no-files-found: error
          retention-days: 30

  publish-template-package:
    name: Publish Populated Template Package
    # A signed run publishes only after signing and its companion succeed, so the template
    # never reaches the feed without the matching companion. An intentionally unsigned run
    # (sign-template-package skipped by its gate) publishes unattested as before. A failed or
    # cancelled signing or companion job publishes nothing.
    if: ${{ !cancelled() && inputs.publish_package && needs.build-template.result == 'success' && needs.generate-package-sbom.result == 'success' && needs.generate-package-provenance.result == 'success' && ((needs.sign-template-package.result == 'skipped' && needs.build-attestation-companion.result == 'skipped') || (needs.sign-template-package.result == 'success' && needs.build-attestation-companion.result == 'success')) }}
    needs:
      - build-template
      - generate-package-sbom
      - generate-package-provenance
      - sign-template-package
      - build-attestation-companion
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Populated Template Package Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.package_name }}-NuGet

      - name: Get Populated Template Attestation Artifact
        if: ${{ needs.build-attestation-companion.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.package_name }}-Attestation

      - name: Install-credential-handler
        run: |
          Import-Module ./package-helpers.psm1
          InstallCredentialHandler

      - name: Push Populated Template Package to Azure
        run: |
          $allPackages = @(Get-ChildItem -Name -Include *.nupkg)
          $companionPackages = @($allPackages | Where-Object { $_ -like "*.Attestation.*" })
          $templatePackages = @($allPackages | Where-Object { $_ -notlike "*.Attestation.*" })
          $attestationDocuments = @(Get-ChildItem -Name -Include *.nupkg.attestation.json)

          # Publication coupling: a signed template must never publish without its companion
          # attestation package. Companions publish FIRST, so the template cannot land on the
          # feed unless its companion already has; any push failure fails this step.
          if ($attestationDocuments.Count -gt 0 -and $companionPackages.Count -eq 0) {
            throw "Attested build artifact carries an attestation document but no companion attestation package; refusing to publish a signed template without its companion."
          }
          if ($companionPackages.Count -gt 0 -and $attestationDocuments.Count -eq 0) {
            throw "Build artifact carries a companion attestation package but no attestation document; refusing to publish an inconsistent artifact."
          }

          # Duplicate coupling: a rebuild of the same version has different bytes, and
          # --skip-duplicate would keep a companion left by an earlier partial publication and
          # pair it with this run's template. With a companion, every package the feed already
          # holds at this version must be this run's exact bytes, checked before any push; those
          # are not pushed again, the rest push without --skip-duplicate so a racing push fails.
          $packagesOnFeed = @()
          $duplicateHandling = @("--skip-duplicate")
          if ($companionPackages.Count -gt 0) {
            $duplicateHandling = @()
            $feedHeaders = @{ Authorization = "Basic " + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(":$env:ARTIFACTS_API_KEY")) }
            $packageBaseAddress = @((Invoke-RestMethod -Uri $env:ARTIFACTS_FEED_URL -Headers $feedHeaders).resources |
                Where-Object { $_.'@type' -like 'PackageBaseAddress/3.0.0*' } | ForEach-Object { $_.'@id' })[0]
            if ([string]::IsNullOrWhiteSpace($packageBaseAddress)) {
              throw "The feed's service index advertises no PackageBaseAddress/3.0.0 resource; cannot check for packages already published at this version."
            }
            foreach ($package in @($companionPackages) + @($templatePackages)) {
              $packageId = if ($package -like "*.Attestation.*") { "${{ inputs.package_name }}.Attestation" } else { "${{ inputs.package_name }}" }
              if (-not $package.StartsWith("$packageId.", [StringComparison]::OrdinalIgnoreCase)) {
                throw "Package file '$package' is not named for package id '$packageId'."
              }
              $lowerId = $packageId.ToLowerInvariant()
              $lowerVersion = $package.Substring($packageId.Length + 1, $package.Length - $packageId.Length - 7).ToLowerInvariant()
              $feedCopy = Join-Path $env:RUNNER_TEMP "feed-copy-$lowerId.$lowerVersion.nupkg"
              $response = Invoke-WebRequest -Uri "$packageBaseAddress$lowerId/$lowerVersion/$lowerId.$lowerVersion.nupkg" -Headers $feedHeaders -OutFile $feedCopy -SkipHttpErrorCheck -PassThru
              if ($response.StatusCode -eq 404) {
                continue
              }
              if ($response.StatusCode -ne 200) {
                throw "Checking the feed for $packageId $lowerVersion failed with HTTP $($response.StatusCode)."
              }
              if ((Get-FileHash -LiteralPath $feedCopy -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash) {
                throw "The feed already holds $packageId $lowerVersion with different bytes than this run's package; refusing to publish, because the template and its companion attestation must come from the same build."
              }
              $packagesOnFeed += $package
            }
          }

          @($companionPackages) + @($templatePackages) | ForEach-Object {
              if ($packagesOnFeed -contains $_) {
                Write-Host "$_ is already on the feed with identical bytes; not pushing it again."
                return
              }
              Write-Host "Pushing $_ to ${{ env.ARTIFACTS_FEED_URL }}"
              $global:LASTEXITCODE = 0
              dotnet nuget push $_ --api-key $env:ARTIFACTS_API_KEY --source "${{ env.ARTIFACTS_FEED_URL }}" @duplicateHandling
              if ($LASTEXITCODE -ne 0) {
                throw "Package push failed for '$_' with exit code $LASTEXITCODE."
              }
           }

  promote-azure-package:
    name: Promote Azure Package
    if: ${{ github.event_name == 'release' && github.event.action == 'released' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_REF: ${{ github.ref_name }}
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A stable release promotes by its tag name, so the name must be a v version first.
      - name: Validate the release tag
        run: |
          Import-Module ./eng/ci/release-classification.psm1
          Assert-ReleaseRef -ReleaseRef $env:RELEASE_REF -Prefix v

      - name: Promote Populated Template Azure Package
        run: |
          Import-Module ./package-helpers.psm1

          $releaseVersion = $env:RELEASE_REF -replace "v", ""
          $companionPackageName = "${{ inputs.package_name }}.Attestation"
          $credential = New-Object -TypeName PSCredential -ArgumentList $env:ARTIFACTS_USERNAME, (ConvertTo-SecureString -String $env:ARTIFACTS_API_KEY -AsPlainText -Force)

          # Promotion coupling mirrors publication: when the companion attestation package
          # exists at this version (attested-era release), it promotes FIRST so the template
          # cannot reach the release view without it. A 404 means an unattested-era release:
          # the template still promotes and restore consumers refuse it (fail-closed). Any
          # other probe outcome is fatal rather than guessed at.
          $probeUri = "${{ env.ARTIFACTS_PACKAGES_URL }}/nuget/packages/$companionPackageName/versions/${releaseVersion}?api-version=5.0-preview.1"
          $probeResponse = Invoke-WebRequest -Uri $probeUri -Method Get -Credential $credential -SkipHttpErrorCheck
          $promoteCompanion = $probeResponse.StatusCode -eq 200
          if (-not $promoteCompanion -and $probeResponse.StatusCode -ne 404) {
            throw "Companion attestation package probe failed with HTTP $($probeResponse.StatusCode) for $companionPackageName@$releaseVersion."
          }
          if (-not $promoteCompanion) {
            Write-Host "::notice title=Unattested-era release::Companion attestation package $companionPackageName@$releaseVersion is not on the feed; promoting the template package only. Restore consumers refuse unattested packages (fail-closed)."
          }

          $arguments = @{
            PackagesURL = "${{ env.ARTIFACTS_PACKAGES_URL }}"
            Username    = $env:ARTIFACTS_USERNAME
            ViewId      = "release"
            ReleaseRef  = $env:RELEASE_REF
            Password    = (ConvertTo-SecureString -String $env:ARTIFACTS_API_KEY -AsPlainText -Force)
          }

          if ($promoteCompanion) {
            $arguments.PackageName = $companionPackageName
            Invoke-Promote @arguments
          }

          $arguments.PackageName = "${{ inputs.package_name }}"
          Invoke-Promote @arguments

  attach-sbom-and-provenance-to-release:
    name: Attach Populated Template SBOM and Provenance to GitHub Release
    runs-on: ubuntu-latest
    needs:
      - generate-package-sbom
      - generate-package-provenance
    if: ${{ startsWith(github.ref, 'refs/tags/') }} # Only run on releases
    # The tag was validated by the build job this one follows through its needs.
    env:
      RELEASE_REF: ${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - name: Download SBOM Artifact
        uses: Ed-Fi-Alliance-OSS/slsa-github-generator/.github/actions/secure-download-artifact@v2.0.0
        with:
          name: "${{ inputs.package_name }}-SBOM"
          path: ${{ inputs.manifest_file }}
          sha256: "${{ needs.generate-package-sbom.outputs.sbom-hash-code }}"

      - name: Download Provenance Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.provenance_file }}

      - name: Attach SBOM to Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $release = $env:RELEASE_REF
          $repo = "${{ github.repository }}"
          $token = $env:GITHUB_TOKEN
          $file = "${{ inputs.manifest_file }}"
          $uploadName = "${{ inputs.package_name }}-SBOM.zip"

          $url = "https://api.github.com/repos/$repo/releases/tags/$release"
          $gh_headers = @{
              "Accept"        = "application/vnd.github+json"
              "Authorization" = "Bearer $token"
          }
          $response = Invoke-RestMethod -Uri $url -Headers $gh_headers
          $releaseId = $response.id

          Compress-Archive $file -DestinationPath $uploadName
          $url = "https://uploads.github.com/repos/$repo/releases/$releaseId/assets"
          $gh_headers["Content-Type"] = "application/octet"
          Invoke-RestMethod -Method POST `
              -Uri "$($url)?name=$($uploadName)" `
              -Headers $gh_headers `
              -InFile $uploadName

      - name: Attach Provenance to Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $release = $env:RELEASE_REF
          $repo = "${{ github.repository }}"
          $token = $env:GITHUB_TOKEN
          $file = "${{ inputs.provenance_file }}"
          $uploadName = "${{ inputs.provenance_file }}"

          $url = "https://api.github.com/repos/$repo/releases/tags/$release"
          $gh_headers = @{
              "Accept"        = "application/vnd.github+json"
              "Authorization" = "Bearer $token"
          }
          $response = Invoke-RestMethod -Uri $url -Headers $gh_headers
          $releaseId = $response.id
          $url = "https://uploads.github.com/repos/$repo/releases/$releaseId/assets"
          $gh_headers["Content-Type"] = "application/octet"
          Invoke-RestMethod -Method POST `
              -Uri "$($url)?name=$($uploadName)" `
              -Headers $gh_headers `
              -InFile $file

  notify-results:
    name: Notify Build Results
    runs-on: ubuntu-latest
    needs: [build-template, generate-package-sbom, generate-package-provenance, sign-template-package, build-attestation-companion, publish-template-package]
    if: always() && github.event_name == 'schedule'
    steps:
      - name: Notify Slack on failure
        if: contains(needs.*.result, 'failure')
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d #v2.0.0
        with:
          payload: |
            {
              "text": "❌ Scheduled Populated Template build failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ Scheduled Populated Template build failed\n*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref }}\n*Package:* ${{ inputs.package_name }}\n*Workflow:* ${{ github.workflow }}\n*Log URL:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
