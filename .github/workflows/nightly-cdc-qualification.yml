name: CDC SQL startup diagnostic
on:
  workflow_dispatch:
    inputs:
      lane:
        type: string
        default: All
      suite:
        type: string
        default: All
permissions:
  contents: read
jobs:
  startup-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CDC_SQL_IMAGE: ${{ vars.CDC_CONNECTOR_TEMPLATE_SQLSERVER_2025_IMAGE }}
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce startup with retained SQL image
        run: python3 eng/ci/startup-diagnostic.py
      - name: Upload bounded summary and encrypted crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdc-sql-startup-diagnostic
          path: startup-diagnostic/
          retention-days: 1
          if-no-files-found: error
