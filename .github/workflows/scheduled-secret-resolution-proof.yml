# DMS-1554: proves end to end that the Configuration Service resolves ${secret:...} references in
# stored connection strings through a plugin, that DMS serves data through the resolved credential,
# and that a rotation in the store reaches a read within SecretsSettings:CacheExpirationSeconds.
#
# This lane is isolated on purpose. Invoke-SecretResolutionE2E.ps1 builds the Configuration Service
# and DMS images and brings a whole stack up and down, and the rotation proof measures real time
# against the cache window, so it is neither fast nor immune to a slow runner. Per-PR validation of
# the resolution seam stays at the unit and integration level; nothing here is added to the PR checks.
# The pull request lane does cover the parts that need no stack: the harness's results check
# (eng/docker-compose/tests/SecretResolutionProof.Tests.ps1) and a build of the fixture plugin.
#
# The harness reads the TRX itself and fails unless every proof executed and passed, so a run whose
# proofs were filtered out or ignored themselves is a failure here, not a green skip.
name: Scheduled Secret Resolution Proof

on:
  workflow_dispatch:
  schedule:
  - cron: '30 6 * * 1-5' # Monday-Friday at 06:30 UTC, ahead of the 08:00 nightly lanes.

permissions: read-all

env:
  CONFIGURATION: "Release"

jobs:
  secret-resolution-proof:
    name: Run the secret resolution proof
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout the Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Nuget packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # The harness owns the whole deployment: it builds both images under its own tags, publishes
      # the fixture plugin, provisions the database, runs the proofs and removes the stack. On a
      # failure it prints the last log lines of the Configuration Service and DMS before teardown.
      - name: Run the secret resolution proof
        run: |
          ./eng/docker-compose/tests/secret-resolution/Invoke-SecretResolutionE2E.ps1 `
            -Configuration ${{ env.CONFIGURATION }} `
            -ResultsDirectory "${{ github.workspace }}/secret-resolution-results"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-resolution-proof-results
          path: ${{ github.workspace }}/secret-resolution-results/*.trx
          if-no-files-found: warn
          retention-days: 10
