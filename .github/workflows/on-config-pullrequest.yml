name: On Config Pull Request

on:
  # No paths filter here: the merge queue requires an aggregate status
  # check (config-ci-gate) that must report on every pull request, so this workflow runs for
  # all PRs regardless of which files changed. detect-fresh-build-changes computes
  # config_relevant and the heavy jobs skip when no config-relevant file changed, so idle PRs
  # stay cheap and the gate still reports (a skipped dependency counts as a pass).
  pull_request:
    # Declaring types replaces the default set (opened, synchronize, reopened), so all three are
    # restated. Jobs skip while a pull request is a draft, and ready_for_review runs them once it is
    # marked ready. converted_to_draft starts a run that skips everything, which cancels the
    # in-flight run through the concurrency group.
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
    branches:
      - main

  merge_group:
    types:
      - checks_requested

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CONFIGURATION: "Release"

permissions: read-all

jobs:
  detect-fresh-build-changes:
    name: Detect Fresh Build Changes
    # Every other job needs this one directly or transitively, so skipping it on a draft skips the
    # whole workflow except the always() jobs, which carry the same check. pull_request is null on
    # merge_group and workflow_dispatch, so those always run.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      fresh_build_required: ${{ steps.detect.outputs.fresh_build_required }}
      # True when the pull request changed a file relevant to config validation. The heavy
      # jobs gate on this so that a PR touching only unrelated areas (e.g. DMS-only) skips the
      # config suite while this workflow still runs and reports config-ci-gate.
      config_relevant: ${{ steps.detect.outputs.config_relevant }}
      # Registry reference for the shared Config image build cache. Computed once here because
      # a container registry reference must be lowercase and the expression language has no
      # lowercase function. The E2E jobs consume it; fresh-rebuild-docker-image does not,
      # because it deliberately builds with --no-cache.
      #
      # This workflow only ever restores from the tag. On DMS Pull Request writes it, from its
      # Build CI Docker Images job, on non-pull_request runs only - which is why no job here
      # needs packages: write. Two things stop that writer, and neither fails anything here:
      # setting the repository variable REBUILD_DOWNSTREAM_IMAGES skips that job's build steps
      # altogether, and the GHCR pruner could evict the tag. The recovery for both is a
      # workflow_dispatch run of On DMS Pull Request on main, which is also eligible to export.
      # Cleanup DMS CI GHCR Images excludes the tag from its own prune and fails when the tag
      # stops resolving, so an evicted or unwritten cache surfaces there instead of silently
      # slowing every build in this file.
      config_cache_ref: ${{ steps.cache-ref.outputs.config_cache_ref }}
    steps:
      - name: Resolve the build cache reference
        id: cache-ref
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "config_cache_ref=ghcr.io/${owner}/data-management-service-ed-fi-api-config-ci:buildcache" >> "$GITHUB_OUTPUT"

      - name: Checkout the Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect files that require a fresh rebuild
        id: detect
        shell: bash
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: bash eng/ci/detect-config-changes.sh

  scan-actions-bidi:
    name: Scan Actions, scan all files for BIDI Trojan Attacks
    needs: detect-fresh-build-changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.detect-fresh-build-changes.outputs.config_relevant == 'true'
    uses: Ed-Fi-Alliance-OSS/Ed-Fi-Actions/.github/workflows/repository-scanner.yml@main
    with:
      config-file-path: ./.github/workflows/bidi-config.json

  verify-lock-files:
    name: Verify Config Lock Files
    needs: detect-fresh-build-changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.detect-fresh-build-changes.outputs.config_relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout the Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Nuget packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore with locked mode
        run: dotnet restore ./src/config/EdFi.DmsConfigurationService.sln --locked-mode

  run-parity-pester-tests:
    name: Run Lock File Parity Tests
    needs: detect-fresh-build-changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.detect-fresh-build-changes.outputs.config_relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout the Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Pester
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force

      - name: Run Lock File Parity Tests
        run: |
          $result = Invoke-Pester -Path "eng/docker-compose/tests/LockFileParity.Tests.ps1" -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) {
              throw "$($result.FailedCount) lock-file parity test(s) failed."
          }

      - name: Run OpenIddict Crypto Tests
        run: |
          $result = Invoke-Pester -Path "eng/docker-compose/tests/OpenIddictCrypto.Tests.ps1" -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) {
              throw "$($result.FailedCount) OpenIddict crypto test(s) failed."
          }

      - name: Run Config MSSQL Compose Startup Tests
        run: |
          $result = Invoke-Pester -Path "eng/docker-compose/tests/ConfigMssqlComposeStartup.Tests.ps1" -Output Detailed -PassThru
          if ($result.FailedCount -gt 0 -or $result.FailedContainersCount -gt 0 -or $result.FailedBlocksCount -gt 0) {
              throw "Config MSSQL compose startup Pester lane failed: $($result.FailedCount) test(s), $($result.FailedContainersCount) container(s), $($result.FailedBlocksCount) block(s)."
          }

      # Guards build-config.ps1's test targets against reporting success when the test-assembly glob
      # matched nothing, which would otherwise exit 0 having executed zero tests.
      - name: Run Build Script Zero-Test Guard Tests
        run: |
          $result = Invoke-Pester -Path "eng/ci/tests/BuildScriptTestGuards.Tests.ps1" -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) {
              throw "$($result.FailedCount) build script zero-test guard test(s) failed."
          }

      # The secret resolution proof runs only on a schedule (scheduled-secret-resolution-proof.yml).
      # Its check that every proof executed and passed is exercised here, so a break in it fails a
      # pull request rather than the next scheduled run.
      - name: Run Secret Resolution Proof Results Tests
        run: |
          $result = Invoke-Pester -Path "eng/docker-compose/tests/SecretResolutionProof.Tests.ps1" -Output Detailed -PassThru
          # Invoke-Pester returns nothing at all for a path that does not exist.
          if ($null -eq $result -or $result.TotalCount -eq 0) {
              throw "Secret resolution proof results Pester lane ran no tests; check that eng/docker-compose/tests/SecretResolutionProof.Tests.ps1 exists."
          }
          if ($result.FailedCount -gt 0 -or $result.FailedContainersCount -gt 0 -or $result.FailedBlocksCount -gt 0) {
              throw "Secret resolution proof results Pester lane failed: $($result.FailedCount) test(s), $($result.FailedContainersCount) container(s), $($result.FailedBlocksCount) block(s)."
          }

      - name: Run Isolated Config E2E Launcher Tests
        run: |
          $result = Invoke-Pester -Path "eng/docker-compose/tests/cms-isolation/Invoke-IsolatedConfigE2E.Tests.ps1" -Output Detailed -PassThru
          $nonPassing = @($result.Tests | Where-Object { $_.Result -ne "Passed" })
          if ($null -eq $result -or $result.TotalCount -eq 0 -or
              $result.FailedContainersCount -gt 0 -or $result.FailedBlocksCount -gt 0 -or
              $nonPassing.Count -gt 0) {
              throw "Isolated Config E2E launcher tests did not all execute and pass."
          }

  verify-security-metadata-tools:
    name: Verify Security Metadata Tools Package
    needs: detect-fresh-build-changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.detect-fresh-build-changes.outputs.config_relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout the Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use the same MinVer source as releases, including tags and history.
          fetch-depth: 0

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Set Version Numbers
        id: versions
        run: |
          Import-Module ./package-helpers.psm1
          Get-VersionNumber -projectPrefix "cs"

      - name: Install Pester
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force

      - name: Run Security Metadata Tools Version and CI Tests
        run: |
          $ErrorActionPreference = "Stop"
          $result = Invoke-Pester -Path @(
              "eng/ci/tests/SecurityMetadataToolsVersioning.Tests.ps1",
              "eng/ci/tests/ConfigPullRequestWorkflow.Tests.ps1"
          ) -Output Detailed -PassThru
          $nonPassing = @($result.Tests | Where-Object { $_.Result -ne "Passed" })
          if ($null -eq $result -or $result.TotalCount -eq 0 -or
              $result.FailedContainersCount -gt 0 -or $result.FailedBlocksCount -gt 0 -or
              $nonPassing.Count -gt 0) {
              throw "Security Metadata Tools version/CI tests did not all pass."
          }

      # Locked pack, inspect the bundled CMS validator/schema, install the exact local
      # package in a fresh tool directory/cache, then verify conversion, merge, and resolve.
      # This script never pushes or promotes a package and requires no feed credentials.
      - name: Pack Install and Verify Offline Security Metadata Commands
        run: ./eng/verification/Test-SecurityMetadataToolsPackage.ps1 -AppVersion '${{ steps.versions.outputs.dms-v }}' -Configuration ${{ env.CONFIGURATION }}

  run-unit-tests:
    name: Run Unit Tests
    needs: detect-fresh-build-changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.detect-fresh-build-changes.outputs.config_relevant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout the Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Nuget packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: ./build-config.ps1 Build -Configuration ${{ env.CONFIGURATION }}

      # No test stages the secret resolution proof's fixture plugin, and the proof runs only on a
      # schedule, so it is compiled here to fail a pull request that breaks it.
      - name: Build the Secret Resolution Fixture Plugin
        run: dotnet build src/plugins/EdFi.Api.Plugins.Hosting.Tests.Unit/Fixtures/Plugins/Acme.FileSecretResolver/Acme.FileSecretResolver.csproj --configuration ${{ env.CONFIGURATION }} --nologo

      - name: Restore .NET tools
        if: success()
        run: dotnet tool restore

      - name: Run Unit Tests
        run: ./build-config.ps1 UnitTest -Configuration ${{ env.CONFIGURATION }}

      - name: Generate Coverage Report
        if: ${{ hashFiles('coverage.cobertura.xml') != '' }}
        run: ./build-config.ps1 Coverage

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Coverage Report
          path: coveragereport

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Unit Test Results
          overwrite: true
          path: |
            **/*.trx

  run-integration-tests:
    name: Run Integration Tests
    needs: detect-fresh-build-changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.detect-fresh-build-changes.outputs.config_relevant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    services:
      postgres:
        image: postgres:18.6-alpine
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432:5432
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
      mssql:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: IntegrationTest1!
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'IntegrationTest1!' -C -Q 'SELECT 1' || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=20s
    steps:
      - name: Checkout the Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Nuget packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: ./build-config.ps1 Build -Configuration ${{ env.CONFIGURATION }}

      # The DmsProvisioning category needs psql, the shared staging volume and the template
      # packages, and fails under GitHub Actions without them, so only
      # run-dms-provisioning-integration-tests runs it.
      - name: Run Integration Tests
        if: success()
        run: ./build-config.ps1 IntegrationTest -Configuration ${{ env.CONFIGURATION }} -IntegrationTestFilter 'Category!=DmsProvisioning'
        env:
          ConnectionStrings__MssqlAdmin: "Server=localhost,1433;User Id=sa;Password=IntegrationTest1!;TrustServerCertificate=true"

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Integration Test Results
          overwrite: true
          path: |
            **/*.trx

  # Live DMS template provisioning lanes (DMS-1438) on both engines: builder packages plus the
  # released template packages from the public feed, which the tests sign with an ephemeral key.
  # SQL Server restores from a runner directory it reads through the runner's group, so it runs
  # through docker run instead of services: (a service starts before the directory exists).
  run-dms-provisioning-integration-tests:
    name: Run DMS Provisioning Integration Tests
    needs: detect-fresh-build-changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.detect-fresh-build-changes.outputs.config_relevant == 'true'
    runs-on: ubuntu-latest
    # Bounds a hung held restore; a full run of both categories takes about ten minutes.
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      MSSQL_SA_PASSWORD: "DmsProvisioning1!"
      ConnectionStrings__PostgresqlDmsAdmin: "Host=127.0.0.1;Port=5432;Username=postgres;Database=postgres"
      ConnectionStrings__MssqlDmsAdmin: "Server=127.0.0.1,1433;User Id=sa;Password=DmsProvisioning1!;TrustServerCertificate=true"
      DMS_PROVISIONING_PSQL_PATH: /usr/lib/postgresql/18/bin/psql
      DMS_PROVISIONING_MSSQL_STAGING_SERVER_PATH: /var/opt/dms-template-staging
      # The released template packages and the effective schema hash their manifests declare.
      TEMPLATE_PACKAGE_VERSION: "8.1.0"
      DMS_EXPECTED_EFFECTIVE_SCHEMA_HASH: "6f7cac1476c6ede6140762df73f04c9b71f3af95f57b0ed03e0e6fa44a799d78"
    services:
      postgres:
        image: postgres:18.6-alpine
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432:5432
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
    steps:
      - name: Checkout the Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Nuget packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # The PostgreSQL 18 dumps use psql meta-commands older clients reject.
      - name: Install the PostgreSQL 18 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes postgresql-client-18
          "$DMS_PROVISIONING_PSQL_PATH" --version

      # 2750 owned by the runner: the tests write staged backups 0640, SQL Server reads them
      # through the runner's group, and the readiness check refuses a group-writable directory.
      - name: Prepare the Staging Directory
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/dms-template-staging"
          mkdir -p "$staging"
          chgrp "$(id -g)" "$staging"
          chmod 2750 "$staging"
          stat -c '%A %U:%G %n' "$staging"
          echo "DMS_PROVISIONING_MSSQL_STAGING_PATH=$staging" >> "$GITHUB_ENV"

      - name: Start SQL Server
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name dms-provisioning-mssql \
            --group-add "$(id -g)" \
            --env ACCEPT_EULA=Y \
            --env MSSQL_SA_PASSWORD \
            --publish 1433:1433 \
            --volume "$DMS_PROVISIONING_MSSQL_STAGING_PATH:$DMS_PROVISIONING_MSSQL_STAGING_SERVER_PATH" \
            mcr.microsoft.com/mssql/server:2025-latest
          for attempt in $(seq 1 60); do
            if docker exec dms-provisioning-mssql /opt/mssql-tools18/bin/sqlcmd \
                -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is ready."
              exit 0
            fi
            sleep 2
          done
          docker logs dms-provisioning-mssql
          echo "SQL Server did not become ready." >&2
          exit 1

      # Pinned by SHA-256: the tests sign whatever they find, so a changed package must fail here.
      - name: Download the Template Packages
        run: |
          $ErrorActionPreference = "Stop"
          $expected = [ordered]@{
              "EdFi.Api.Minimal.Template.PostgreSql.5.2.0" = "bdc9142e730d2b28cbf7e4e821d26e6b74d6ad3d53ee069f528fcc4d52e67af2"
              "EdFi.Api.Populated.Template.PostgreSql.5.2.0" = "034c1c3e1051e56c5658a4feba13f9d7987a0240e3afa1b0da324c9db46f4d20"
              "EdFi.Api.Minimal.Template.MsSql.5.2.0" = "c87ba7d9ec1802007987cb97874a39a68d4171c4a4adbbe39a7a0e6b7901f8a6"
              "EdFi.Api.Populated.Template.MsSql.5.2.0" = "9bd0a54a10fbe345a56fea05d419a6c8d8b532db8948ba4e915aa4f86a53b66b"
          }
          $index = Invoke-RestMethod "https://pkgs.dev.azure.com/ed-fi-alliance/Ed-Fi-Alliance-OSS/_packaging/EdFi%40Release/nuget/v3/index.json"
          $baseAddress = @($index.resources | Where-Object { $_."@type" -like "PackageBaseAddress*" })[0]."@id"
          $directory = Join-Path $env:RUNNER_TEMP "dms-template-packages"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $version = $env:TEMPLATE_PACKAGE_VERSION
          foreach ($id in $expected.Keys) {
              $lowerId = $id.ToLowerInvariant()
              $file = Join-Path $directory "$id.$version.nupkg"
              Invoke-WebRequest "$baseAddress$lowerId/$version/$lowerId.$version.nupkg" -OutFile $file
              $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
              if ($actual -ne $expected[$id]) {
                  throw "$id $version has SHA-256 $actual; expected $($expected[$id])."
              }
              Write-Output "$id $version $actual"
          }
          "DMS_TEMPLATE_PACKAGE_DIRECTORY=$directory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        run: ./build-config.ps1 Build -Configuration ${{ env.CONFIGURATION }}

      # A lane setting the job forgot fails its fixtures (DmsProvisioningLaneRequirement); the
      # result check also fails a run in which any test was skipped for another reason.
      - name: Run DMS Provisioning Integration Tests
        run: |
          $projects = @(
              "src/config/backend/EdFi.DmsConfigurationService.Backend.Postgresql.Tests.Integration/EdFi.DmsConfigurationService.Backend.Postgresql.Tests.Integration.csproj",
              "src/config/backend/EdFi.DmsConfigurationService.Backend.Mssql.Tests.Integration/EdFi.DmsConfigurationService.Backend.Mssql.Tests.Integration.csproj"
          )
          $results = "dms-provisioning-test-results"
          $problems = [System.Collections.Generic.List[string]]::new()
          foreach ($project in $projects) {
              $name = [IO.Path]::GetFileNameWithoutExtension($project)
              dotnet test $project --configuration $env:CONFIGURATION --no-build --no-restore --nologo `
                  --filter "Category=DmsProvisioning" `
                  --results-directory $results `
                  --logger "trx;LogFileName=$name.trx" `
                  --logger "console;verbosity=normal"
              if ($LASTEXITCODE -ne 0) {
                  $problems.Add("$name exited with $LASTEXITCODE")
              }
              $trx = Join-Path $results "$name.trx"
              if (-not (Test-Path -LiteralPath $trx)) {
                  $problems.Add("$name wrote no results")
                  continue
              }
              $counters = ([xml](Get-Content -LiteralPath $trx -Raw)).TestRun.ResultSummary.Counters
              Write-Output "${name}: total $($counters.total), passed $($counters.passed), failed $($counters.failed), not executed $($counters.notExecuted)"
              if ([int]$counters.total -eq 0 -or [int]$counters.passed -ne [int]$counters.total) {
                  $problems.Add("$name passed $($counters.passed) of $($counters.total)")
              }
          }
          if ($problems.Count -gt 0) {
