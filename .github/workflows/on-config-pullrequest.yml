          -Configuration ${{ env.CONFIGURATION }} -SkipDockerBuild
          -EnvironmentFile ./.env.config.e2e
          -SecurityMetadataToolsScenario Hybrid -DataStandardVersion 5.2

      - name: Run Isolated postgresql Hybrid Policy Scenario - DS 6.1
        if: matrix.identityprovider == 'self-contained'
        run: >-
          ./eng/docker-compose/tests/cms-isolation/Invoke-IsolatedConfigE2E.ps1
          -Configuration ${{ env.CONFIGURATION }} -SkipDockerBuild
          -EnvironmentFile ./.env.config.e2e
          -SecurityMetadataToolsScenario Hybrid -DataStandardVersion 6.1

      - name: Run Isolated postgresql Filesystem Policy Scenario - DS 5.2
        if: matrix.identityprovider == 'self-contained'
        run: >-
          ./eng/docker-compose/tests/cms-isolation/Invoke-IsolatedConfigE2E.ps1
          -Configuration ${{ env.CONFIGURATION }} -SkipDockerBuild
          -EnvironmentFile ./.env.config.e2e
          -SecurityMetadataToolsScenario Filesystem -DataStandardVersion 5.2

      - name: Run Isolated postgresql Upload Policy Scenario - DS 5.2
        if: matrix.identityprovider == 'self-contained'
        run: >-
          ./eng/docker-compose/tests/cms-isolation/Invoke-IsolatedConfigE2E.ps1
          -Configuration ${{ env.CONFIGURATION }} -SkipDockerBuild
          -EnvironmentFile ./.env.config.e2e
          -SecurityMetadataToolsScenario Upload -DataStandardVersion 5.2

      - name: Run Isolated postgresql Drift Policy Scenario - DS 5.2
        if: matrix.identityprovider == 'self-contained'
        run: >-
          ./eng/docker-compose/tests/cms-isolation/Invoke-IsolatedConfigE2E.ps1
          -Configuration ${{ env.CONFIGURATION }} -SkipDockerBuild
          -EnvironmentFile ./.env.config.e2e
          -SecurityMetadataToolsScenario Drift -DataStandardVersion 5.2
          -UseInstalledTool -AppVersion '${{ steps.versions.outputs.dms-v }}'

      - name: Upload Logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs-postgresql-${{ matrix.identityprovider }}
          path: |
            TestResults/cms-isolation/postgresql/**/*.log
          retention-days: 10

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: E2E Test Results - postgresql - ${{ matrix.identityprovider }}
          path: |
            **/*.trx
            TestResults/cms-isolation/postgresql/**

