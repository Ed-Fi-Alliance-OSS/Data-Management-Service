  # DMS-1552 and DMS-1555: the EdFi.Api.Secrets contract package. Packs it into a local folder feed,
  # asserts the packed assembly's version equals the package version and that the packed readme is
  # the implementer guide, compiles a scratch consumer that implements both contracts against that
  # feed alone, and compiles the guide's worked examples against it and the packed EdFi.Api.Plugins.
  # It also compiles the scratch consumer against the package published on the Ed-Fi feed once the
  # declared version is there, and reports in as many words when it is not yet. Then asserts the
  # packed contents - metadata, exported types, XML docs, no dependencies - as the prerelease lane
  # does before publishing. Then runs the versioning and publication-wiring proofs once per pull
  # request: the packed nupkg's identity and version, solution membership, the prerelease and
  # release lanes' wiring, a real build-config.ps1 BuildAndPublish with explicit versions followed
  # by a pack of what it built, and a real DockerBuild with an explicit assembly version, each with
  # a control showing the Configuration Service assemblies were built by that run. Kept out of
  # run-parity-pester-tests because the last two build the whole solution and the image.
  verify-secrets-contract:
    name: Verify Secrets Contract Package
    needs: detect-fresh-build-changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.detect-fresh-build-changes.outputs.config_relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout the Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # build-config.ps1 DockerBuild uses `docker buildx build --build-context`.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Pack EdFi.Api.Secrets and Compile the Scratch Consumer and Worked Examples
        run: |
          $ErrorActionPreference = "Stop"

          # Fresh feed and global-packages folders per run. The script refuses non-empty ones, so a
          # stale nupkg or an already-extracted same-version package can never be what it restores.
          # The published check reads the Ed-Fi feed anonymously, as every restore in this workflow
          # already does, so it needs no secret and runs the same on a fork. An unreadable feed fails
          # the step rather than reading as "not yet published".
          $runId = [guid]::NewGuid().ToString('N')
          $feed = Join-Path $env:RUNNER_TEMP "secrets-feed-$runId"
          ./eng/verification/Invoke-SecretsConsumerCheck.ps1 `
            -Configuration ${{ env.CONFIGURATION }} `
            -FeedDirectory $feed `
            -NuGetPackagesDirectory (Join-Path $env:RUNNER_TEMP "nuget-verify-secrets-$runId") `
            -PublishedServiceIndexUrl "https://pkgs.dev.azure.com/ed-fi-alliance/Ed-Fi-Alliance-OSS/_packaging/EdFi/nuget/v3/index.json" `
            -PublishedNuGetPackagesDirectory (Join-Path $env:RUNNER_TEMP "nuget-verify-published-secrets-$runId")

          # The check the prerelease lane runs before it uploads the package for publication, run
          # here on the same packed artifact so a contents change fails its pull request first.
          Import-Module ./package-helpers.psm1
          $contractVersion = Get-SecretsContractVersion
          ./eng/verification/Assert-SecretsPackage.ps1 `
            -PackageFile (Join-Path $feed "EdFi.Api.Secrets.$contractVersion.nupkg") `
            -ExtractTo (Join-Path $env:RUNNER_TEMP "secrets-nupkg-$runId") `
            -PackageId "EdFi.Api.Secrets" `
            -ExpectedPackageVersion $contractVersion

      - name: Install Pester
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force

      - name: Run Secrets Contract Versioning Tests
        run: |
          $ErrorActionPreference = "Stop"

          $result = Invoke-Pester -Path "eng/ci/tests/ConfigSecretsContractVersioning.Tests.ps1" -Output Detailed -PassThru

          # A discovery-time failure produces no test object, and a skipped or inconclusive proof
          # reads as green unless it is counted; every case here must actually pass.
          $nonPassing = @($result.Tests | Where-Object { $_.Result -ne "Passed" })
          if ($result.FailedContainersCount -gt 0 -or $result.FailedBlocksCount -gt 0 -or $result.TotalCount -eq 0 -or $nonPassing.Count -gt 0) {
              $summary = ($nonPassing | ForEach-Object { "$($_.Result): $($_.ExpandedName)" }) -join "`n"
              throw "Secrets contract versioning tests did not all pass: $($result.TotalCount) total, $($result.FailedContainersCount) failed container(s), $($result.FailedBlocksCount) failed block(s).`n$summary"
          }

  fresh-rebuild-docker-image:
    name: Fresh Rebuild Config Docker Image
    needs: detect-fresh-build-changes
    if: >-
      needs.detect-fresh-build-changes.outputs.fresh_build_required == 'true' &&
      (github.event_name != 'pull_request' ||
      needs.detect-fresh-build-changes.outputs.config_relevant == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout the Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Fresh rebuild Config Docker image
        working-directory: eng/docker-compose
        run: |
          docker compose -f postgresql.compose.yml -f local-config.compose.yml -f keycloak.compose.yml --env-file "./.env.config.e2e" -p cs-local build --no-cache

  event_file:
    name: Upload Event File
    runs-on: ubuntu-latest
    needs: [verify-lock-files, run-parity-pester-tests, verify-security-metadata-tools, verify-secrets-contract, run-unit-tests, run-e2e-tests, run-e2e-tests-mssql, run-e2e-tests-mssql-multitenant, run-integration-tests, run-dms-provisioning-integration-tests, fresh-rebuild-docker-image]
    # always() overrides the skip a draft inherits through needs, so the draft check is repeated.
    if: always() && github.event.pull_request.draft != true
    steps:
    - name: Upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: Event File
        path: ${{ github.event_path }}

  # Single aggregate status check for this workflow. The merge queue merges an entry the
  # moment every required status check passes on the merge-group ref, so without one check
  # that depends on the whole pipeline the queue would satisfy its other required checks and
  # merge while these jobs were still running, cancelling them. Making this the required check
  # forces the queue (and PR merges) to wait for the full pipeline. It runs even when upstream
  # jobs fail, are cancelled, or are skipped, then fails unless every dependency succeeded or
  # was intentionally skipped (a failed prerequisite surfaces directly, so a skipped dependent
  # is safe to treat as a pass). Keep this needs list aligned with the validation and build
  # jobs above; event_file is deliberately omitted so informational tasks can never block a
  # merge.
  config-ci-gate:
    name: Config CI Gate
    needs:
      - detect-fresh-build-changes
      - scan-actions-bidi
      - verify-lock-files
      - run-parity-pester-tests
      - verify-secrets-contract
      - verify-security-metadata-tools
      - run-unit-tests
      - run-integration-tests
      - run-dms-provisioning-integration-tests
      - run-e2e-tests
      - run-e2e-tests-mssql
      - run-e2e-tests-mssql-multitenant
      - fresh-rebuild-docker-image
    # Reports whatever its dependencies did, except on a draft, where nothing runs. A draft cannot
    # be merged or enqueued, and ready_for_review re-runs the workflow so the gate reports then.
    if: always() && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Verify all required jobs succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          $needs = $env:NEEDS_JSON | ConvertFrom-Json
          $failed = [System.Collections.Generic.List[string]]::new()
          foreach ($job in $needs.PSObject.Properties) {
            $result = $job.Value.result
            Write-Host "$($job.Name): $result"
            if ($result -ne 'success' -and $result -ne 'skipped') {
              $failed.Add("$($job.Name) ($result)")
            }
          }
          if ($failed.Count -gt 0) {
            throw "Config CI Gate failed. Required job(s) did not succeed: $($failed -join ', ')."
          }
          Write-Host "All required Config CI jobs succeeded or were skipped."
