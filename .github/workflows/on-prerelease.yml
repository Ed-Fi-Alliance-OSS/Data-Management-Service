  docker-publish-dms:
    name: Publish DMS to Docker Hub
    runs-on: ubuntu-latest
    needs:
      - publish-package-dms
    steps:
      - name: Wait 20s
        # Give Azure Artifacts caching a moment to catch up
        run: sleep 20

      - name: Prepare DMS Tags
        id: prepare-tags
        run: |
          REF="${{ env.REF }}"
          PACKAGEVERSION=${REF}

          if [[ $PACKAGEVERSION =~ "alpha" ]]
          then
            # Pre-releases get the tag "pre"
            DMSTAGS="${{ env.IMAGE_NAME }}:pre"
          else
            # Releases get the version, plus shortened form for minor release.
            # We are not using shortened form for major or using "latest"
            # because they are too imprecise.
            MINOR=`echo ${PACKAGEVERSION} | awk -F"." '{print $1"."$2}'`
            DMSTAGS="${{ env.IMAGE_NAME }}:${PACKAGEVERSION},${{ env.IMAGE_NAME }}:${MINOR}"
          fi

          SEMVERSION=${PACKAGEVERSION:8}  # strip off the leading 'dms-pre-'
          echo "DMSTAGS=$DMSTAGS" >> $GITHUB_OUTPUT
          echo "VERSION=$SEMVERSION" >> $GITHUB_OUTPUT

      - name: Set up DMS Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub for DMS
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Data Management Service image
        id: metadatamanagementservice
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build and push DMS image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: "{{defaultContext}}:src/dms"
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:pre
          cache-to: type=inline
          build-args: VERSION=${{ steps.prepare-tags.outputs.VERSION }}
          file: Nuget.Dockerfile
          tags: ${{ steps.prepare-tags.outputs.DMSTAGS }}
          labels: ${{ steps.metadatamanagementservice.outputs.labels }}
          push: true

  attach-dms-host-assembly-manifest:
    name: Attach DMS Host Assembly Manifest to GitHub Release
    runs-on: ubuntu-latest
    # This is the edge that makes the manifest a job of its own rather than one more upload inside
    # attach-dms-artifacts-to-release. That job needs the pack, SBOM and provenance jobs and has no
    # dependency on docker-publish-dms at all, so the two run concurrently and a generator step added
    # there could inspect an image that has not been pushed yet.
    needs:
      - docker-publish-dms
    # The same gate attach-dms-artifacts-to-release carries, and deliberately not the one
    # docker-publish-dms carries, which is none at all. An alpha prerelease has no vX.Y.Z release to
    # attach an asset to, so an alpha publishes an image and no manifest - which is already what
    # happens to the SBOM and the provenance.
    if: ${{ startsWith(github.event.release.tag_name, 'dms-') && !contains(github.event.release.tag_name, 'alpha') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare release version
        id: prepare-version
        shell: bash
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"

          # Remove 'dms-pre-' prefix and add 'v' to match release format
          SEMVER="v${TAG_NAME#dms-pre-}"

          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "Release version: $SEMVER"

      - name: Generate Host Assembly Manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # The tag docker-publish-dms actually pushed, which carries the whole dms-pre- prefix:
          # that job composes its tags from REF without stripping anything, so the image is
          # <repository>:dms-pre-X.Y.Z. The vX.Y.Z form prepared above names the GitHub release and
          # is not an image tag. The generator pulls this tag and resolves it to one immutable
          # digest before it inspects anything, so a tag republished mid-run cannot make one
          # manifest describe two images.
          ./eng/verification/New-HostAssemblyManifest.ps1 `
            -Image "${{ env.IMAGE_NAME }}:${{ env.REF }}" `
            -OutputPath "host-assembly-manifest.md"

      - name: Assert Host Assembly Manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Each contract's own declared version, read from this checkout rather than passed as a
          # literal, so the assertion is made against the versions this release's source declares.
          Import-Module ./package-helpers.psm1

          ./eng/verification/Assert-HostAssemblyManifest.ps1 `
            -ManifestPath "host-assembly-manifest.md" `
            -ExpectedPluginsVersion (Get-PluginsContractVersion) `
            -ExpectedCustomValidationVersion (Get-CustomValidationContractVersion)

      - name: Attach Host Assembly Manifest to release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $release = "${{ steps.prepare-version.outputs.semver }}"
          $repo = "${{ github.repository }}"
          $token = "${{ secrets.GITHUB_TOKEN }}"

          $gh_headers = @{
              "Accept"        = "application/vnd.github+json"
              "Authorization" = "Bearer $token"
          }
          $response = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/tags/$release" -Headers $gh_headers
          $releaseId = $response.id

          # Uploaded as it stands rather than compressed, unlike the SBOM beside it. That one is a
          # directory that has to be packed; this is one small Markdown file an implementer reads in
          # the browser before choosing what to build against.
          $uploadName = "host-assembly-manifest.md"
          $uploadUrl = "https://uploads.github.com/repos/$repo/releases/$releaseId/assets"
          $gh_headers["Content-Type"] = "application/octet-stream"

          Write-Host "Uploading manifest as $uploadName"
          Invoke-RestMethod -Method POST `
              -Uri "$($uploadUrl)?name=$($uploadName)" `
              -Headers $gh_headers `
              -InFile $uploadName

  # jobs for Config
  pack-cs:
    name: Build and Pack Config
    if: startsWith(github.event.release.tag_name, 'cs-')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      hash-code: ${{ steps.hash-code.outputs.hash-code }}
      dms-version: ${{ steps.versions.outputs.dms-v }}
      assembly-version: ${{ steps.versions.outputs.cs-assembly-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Set Config Version Numbers
        id: versions
        run: |
          Import-Module ./package-helpers.psm1
          Get-VersionNumber -projectPrefix "cs"

      - name: Publish Config .NET Assemblies
        run: |
          $packageVersion = "${{ steps.versions.outputs.dms-semver }}" -replace "cs-v", ""
          $assemblyVersion = "${{ steps.versions.outputs.cs-assembly-version }}"

          ./build-config.ps1 -Command BuildAndPublish `
              -Configuration Release `
              -DmsCSVersion $packageVersion `
              -DmsCSAssemblyVersion $assemblyVersion `
              -LockedMode

      - name: Verify Config DLL Version Stamp
        run: |
          $publishDir = "src/config/frontend/EdFi.DmsConfigurationService.Frontend.AspNetCore/publish"
          $dllName = "EdFi.DmsConfigurationService.Frontend.AspNetCore.dll"

          $dll = Get-ChildItem -Path $publishDir -Filter $dllName -Recurse | Select-Object -First 1
          if ($null -eq $dll) {
            Write-Error "DLL not found: $dllName under $publishDir"
            exit 1
          }

          $expectedVersion = "${{ steps.versions.outputs.cs-assembly-version }}"
          $semver = "${{ steps.versions.outputs.dms-semver }}" -replace "cs-v", ""
          $normalizedAssemblyVersion = $expectedVersion

          $assemblyName = [System.Reflection.AssemblyName]::GetAssemblyName($dll.FullName)
          $dllAssemblyVersion = $assemblyName.Version.ToString()

          $fileVersionInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($dll.FullName)
          $fileVersion = $fileVersionInfo.FileVersion
          $productVersion = $fileVersionInfo.ProductVersion

          Write-Output "Full semver:                  $semver"
          Write-Output "Normalized assembly version:  $normalizedAssemblyVersion"
          Write-Output "DLL assembly version:         $dllAssemblyVersion"
          Write-Output "FileVersionInfo.FileVersion:  $fileVersion"
          Write-Output "FileVersionInfo.ProductVersion: $productVersion"

          if ($dllAssemblyVersion -ne $expectedVersion) {
            Write-Error "Assembly version mismatch: expected '$expectedVersion' but DLL reports '$dllAssemblyVersion'"
            exit 1
          }

          Write-Output "Assembly version stamp verified: $dllAssemblyVersion"

      - name: Create Config NuGet Package
        run: |
          $packageVersion = "${{ steps.versions.outputs.dms-semver }}" -replace "cs-v", ""

          ./build-config.ps1 -Command Package `
              -DmsCSVersion $packageVersion `
              -Configuration Release

      - name: Generate Config hash for NuGet package
        id: hash-code
        run: |
          "hash-code=$(sha256sum *.nupkg | base64 -w0)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Config Packages as Artifacts
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.CS_PACKAGE_NAME }}-NuGet"
          path: ${{ github.workspace }}/*.nupkg
          if-no-files-found: error
          retention-days: 30

  sbom-create-cs:
    name: Create Config SBOM
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    needs: pack-cs
    permissions:
      actions: read
      contents: write
    outputs:
      sbom-hash-code: ${{ steps.sbom-hash-code.outputs.sbom-hash-code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Config Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.CS_PACKAGE_NAME }}-NuGet

      - name: Generate Config Software Bill of Materials (SBOM)
        run: |
          $packageName = "${{ env.CS_PACKAGE_NAME }}"
          $version = "${{ needs.pack-cs.outputs.dms-version }}"

          Get-ChildItem -Include "$packageName.*.nupkg" -Recurse | ForEach-Object { $_.FullName } > buildfilelist.txt

          dotnet tool install --global Microsoft.Sbom.DotNetTool

          sbom-tool generate `
              -b ./ `
              -bl ./buildfilelist.txt `
              -bc "./" `
              -pn "$packageName" `
              -pv $version `
              -nsb https://ed-fi.org `
              -m ./ `
              -ps "Ed-Fi Alliance"

          cp _manifest/spdx_2.2/manifest.spdx.* .

      - name: Upload Config SBOM
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.CS_PACKAGE_NAME }}-SBOM
          path: ${{ env.MANIFEST_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Generate Config hash code for SBOM
        id: sbom-hash-code
        shell: bash
        run: |
          # sha256sum returns "<hashcode>  <name of file". Split that and return only the <hashcode>.
          sbom_hash=$(sha256sum ./${{ env.MANIFEST_FILE }} | awk '{split($0,a); print a[1]}')
          echo "sbom-hash-code=$sbom_hash" >> $GITHUB_OUTPUT

  provenance-create-cs:
    name: Create Config Provenance
    needs: pack-cs
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: Ed-Fi-Alliance-OSS/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.pack-cs.outputs.hash-code }}
      provenance-name: edfiApiConfig.intoto.jsonl
      upload-assets: false
      # TODO: remove this after this issue is resolved: https://github.com/slsa-framework/slsa-github-generator/issues/876
      compile-generator: true

  publish-package-cs:
    name: Publish Config NuGet Package
    needs: pack-cs
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Config Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.CS_PACKAGE_NAME }}-NuGet

      - name: Install-credential-handler Config
        run: |
            Import-Module ./package-helpers.psm1
            InstallCredentialHandler

      - name: Push Config Package to Azure Artifacts
        run: |
         $artifact = (Get-ChildItem -Path $_ -Name -Include *.nupkg)
         $arguments = @{
           EdFiNuGetFeed = "${{ env.ARTIFACTS_FEED_URL }}"
           NuGetApiKey = "${{ env.ARTIFACTS_API_KEY }}"
         }

         $artifact | ForEach-Object {
             $arguments.PackageFile = $_
             ./build-config.ps1 Push @arguments
          }

  # cs-pre and cs-*-alpha releases, will not have artifacts attached.
  # This step attach Config artifacts to the release with tag vX.Y.Z without 'alpha' or 'pre' in the tag name.
  attach-cs-artifacts-to-release:
    name: Attach Config Artifacts to GitHub Release
    runs-on: ubuntu-latest
    needs:
      - pack-cs
      - sbom-create-cs
      - provenance-create-cs
    if: ${{ startsWith(github.event.release.tag_name, 'cs-') && !contains(github.event.release.tag_name, 'alpha') }}
    permissions:
      contents: write
    steps:
      - name: Prepare release version
        id: prepare-version
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"

          # Remove 'cs-pre-' prefix and add 'v' to match release format
          SEMVER="v${TAG_NAME#cs-pre-}"

          echo "semver=$SEMVER" >> $GITHUB_OUTPUT
          echo "Release version: $SEMVER"

      - name: Download CS SBOM
        uses: Ed-Fi-Alliance-OSS/slsa-github-generator/.github/actions/secure-download-artifact@v2.0.0
        with:
          name: "${{ env.CS_PACKAGE_NAME }}-SBOM"
          path: ${{ env.MANIFEST_FILE }}
          sha256: "${{ needs.sbom-create-cs.outputs.sbom-hash-code }}"

      - name: Download CS Provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: edfiApiConfig.intoto.jsonl

      - name: Attach CS SBOM and Provenance to release
        shell: pwsh
        run: |
          $release = "${{ steps.prepare-version.outputs.semver }}"
          $repo = "${{ github.repository }}"
          $token = "${{ secrets.GITHUB_TOKEN }}"

          $url = "https://api.github.com/repos/$repo/releases/tags/$release"
          $gh_headers = @{
              "Accept"        = "application/vnd.github+json"
              "Authorization" = "Bearer $token"
          }
          $response = Invoke-RestMethod -Uri $url -Headers $gh_headers
          $releaseId = $response.id

          # Upload SBOM
          $sbomFile = "${{ env.MANIFEST_FILE }}"
          $sbomUploadName = "${{ env.CS_PACKAGE_NAME }}-SBOM.zip"

          Compress-Archive $sbomFile -DestinationPath $sbomUploadName

          $uploadUrl = "https://uploads.github.com/repos/$repo/releases/$releaseId/assets"
          $gh_headers["Content-Type"] = "application/octet-stream"

          Write-Host "Uploading SBOM as $sbomUploadName"
          Invoke-RestMethod -Method POST `
              -Uri "$($uploadUrl)?name=$($sbomUploadName)" `
              -Headers $gh_headers `
              -InFile $sbomUploadName

          # Upload Provenance
          $provenanceFile = "edfiApiConfig.intoto.jsonl"
          $provenanceUploadName = "edfiApiConfig.intoto.jsonl"

          Write-Host "Uploading Provenance as $provenanceUploadName"
          Invoke-RestMethod -Method POST `
              -Uri "$($uploadUrl)?name=$($provenanceUploadName)" `
              -Headers $gh_headers `
              -InFile $provenanceFile

  docker-publish-cs:
    name: Publish Config to Docker Hub
    runs-on: ubuntu-latest
    needs:
      - pack-cs
      - publish-package-cs
    steps:
      - name: Wait 20s
        # Give Azure Artifacts caching a moment to catch up
        run: sleep 20

      - name: Prepare Config Tags
        id: prepare-tags
        run: |
          REF="${{ env.REF }}"
          PACKAGEVERSION=${REF}

          if [[ $PACKAGEVERSION =~ "alpha" ]]
          then
            # Pre-releases get the tag "pre"
            DMSTAGS="${{ env.CONFIG_IMAGE_NAME }}:pre"
          else
            # Releases get the version, plus shortened form for minor release.
            # We are not using shortened form for major or using "latest"
            # because they are too imprecise.
            MINOR=`echo ${PACKAGEVERSION} | awk -F"." '{print $1"."$2}'`
            DMSTAGS="${{ env.CONFIG_IMAGE_NAME }}:${PACKAGEVERSION},${{ env.CONFIG_IMAGE_NAME }}:${MINOR}"
          fi

          SEMVERSION=${PACKAGEVERSION:7}  # strip off the leading 'cs-pre-'

          echo "DMSTAGS=$DMSTAGS" >> $GITHUB_OUTPUT
          echo "VERSION=$SEMVERSION" >> $GITHUB_OUTPUT

      - name: Set up Config Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub for Config
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Configuration Service image
        id: metadatamanagementservice
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.CONFIG_IMAGE_NAME }}

      - name: Build and push Config image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: "{{defaultContext}}:src/config"
          cache-from: type=registry,ref=${{ env.CONFIG_IMAGE_NAME }}:pre
          cache-to: type=inline
          build-args: |
            VERSION=${{ steps.prepare-tags.outputs.VERSION }}
            ASSEMBLY_VERSION=${{ needs.pack-cs.outputs.assembly-version }}
          file: Nuget.Dockerfile
          tags: ${{ steps.prepare-tags.outputs.DMSTAGS }}
          labels: ${{ steps.metadatamanagementservice.outputs.labels }}
          push: true
