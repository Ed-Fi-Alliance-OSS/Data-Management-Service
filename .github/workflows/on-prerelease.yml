name: On Pre-Release for DMS and Config Service
on:
  release:
    types:
      - prereleased
  # A dispatch is a dry run of the two contract chains, and only ever that. It runs pack-plugins
  # and pack-custom-validation and, through their needs, the two SBOM jobs, the two SLSA provenance
  # jobs, the two preserve-provenance jobs and the two read-only check jobs, so a branch can prove
  # it produces both nupkgs, both SPDX 2.2 manifests and both provenance files with the real
  # generator, and reaches a publish decision against the live feed, before a release ever fires
  # this workflow.
  #
  # Nothing is published on a dispatch. The two contract publish jobs test event_name and skip,
  # which is where the package pushes live; the check jobs only read the feed. Every other job here
  # is either gated on github.event.release.tag_name, which a dispatch does not carry, or follows by
  # needs from a job that is, so pack-dms, pack-schema-tools, pack-cs and everything downstream of
  # them - the EdFi.Api, SchemaTools and Configuration Service pushes, both image publications,
  # every release-asset upload and the host assembly manifest - are skipped rather than run against
  # a branch. The version steps still run: minver computes a height-based version from the nearest
  # v* tag, which is the deliberately wrong release version the contract assertions prove is ignored.
  workflow_dispatch:

env:
  ARTIFACTS_API_KEY: ${{ secrets.AZURE_ARTIFACTS_PERSONAL_ACCESS_TOKEN }}
  ARTIFACTS_FEED_URL: "https://pkgs.dev.azure.com/ed-fi-alliance/Ed-Fi-Alliance-OSS/_packaging/EdFi/nuget/v3/index.json"
  ARTIFACTS_PACKAGES_URL: ${{ vars.ARTIFACTS_PACKAGES_URL }}
  ARTIFACTS_USERNAME: ${{ secrets.AZURE_ARTIFACTS_USER_NAME }}
  VSS_NUGET_EXTERNAL_FEED_ENDPOINTS: '{"endpointCredentials": [{"endpoint": "https://pkgs.dev.azure.com/ed-fi-alliance/Ed-Fi-Alliance-OSS/_packaging/EdFi/nuget/v3/index.json","password": "${{ secrets.AZURE_ARTIFACTS_PERSONAL_ACCESS_TOKEN }}"}]}'
  MANIFEST_FILE: "_manifest/spdx_2.2/manifest.spdx.json"
  DMS_PACKAGE_NAME: "EdFi.Api"
  SCHEMA_TOOLS_PACKAGE_NAME: "EdFi.Api.SchemaTools"
  PLUGINS_PACKAGE_NAME: "EdFi.Api.Plugins"
  CUSTOM_VALIDATION_PACKAGE_NAME: "EdFi.Api.CustomValidation"
  CS_PACKAGE_NAME: "EdFi.Api.ConfigurationService"
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}
  CONFIG_IMAGE_NAME: "edfialliance/ed-fi-api-configuration-service"
  DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
  REF: ${{ github.ref_name }}

permissions: read-all

jobs:
  # jobs for DMS
  pack-dms:
    name: Build and Pack DMS
    # EdFi.Api ships both contract assemblies, so it is not built until both read-only contract
    # checks have passed: a contract refused at its declared version must not reach a DMS package
    # or, through publish-package-dms and docker-publish-dms, an image. A dispatch runs the checks
    # and this job stays skipped by its own condition.
    needs:
      - check-plugins-contract
      - check-custom-validation-contract
    if: startsWith(github.event.release.tag_name, 'dms-')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      hash-code: ${{ steps.hash-code.outputs.hash-code }}
      dms-version: ${{ steps.versions.outputs.dms-v }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Set DMS Version Numbers
        id: versions
        run: |
          Import-Module ./package-helpers.psm1
          Get-VersionNumber -projectPrefix "dms"

      - name: Publish DMS .NET Assemblies
        run: |
          $packageVersion = "${{ steps.versions.outputs.dms-semver }}" -replace "dms-v", ""

          ./build-dms.ps1 -Command BuildAndPublish `
              -Configuration Release `
              -DMSVersion $packageVersion `
              -LockedMode

      - name: Create DMS NuGet Package
        run: |
          $packageVersion = "${{ steps.versions.outputs.dms-semver }}" -replace "dms-v", ""

          ./build-dms.ps1 -Command Package `
              -DMSVersion $packageVersion `
              -Configuration Release `
              -PackageTarget Api

      - name: Generate DMS hash for NuGet package
        id: hash-code
        run: |
          $packageFile = "${{ env.DMS_PACKAGE_NAME }}.${{ steps.versions.outputs.dms-v }}.nupkg"
          if (-not (Test-Path $packageFile)) {
            throw "Expected DMS package was not found: $packageFile"
          }

          "hash-code=$(sha256sum $packageFile | base64 -w0)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload DMS Packages as Artifacts
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.DMS_PACKAGE_NAME }}-NuGet"
          path: ${{ github.workspace }}/${{ env.DMS_PACKAGE_NAME }}.${{ steps.versions.outputs.dms-v }}.nupkg
          if-no-files-found: error
          retention-days: 30

  pack-schema-tools:
    name: Build and Pack SchemaTools
    # The SchemaTools tool package carries both contract assemblies through its Core reference, so
    # it waits on the same two checks as pack-dms.
    needs:
      - check-plugins-contract
      - check-custom-validation-contract
    if: startsWith(github.event.release.tag_name, 'dms-')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      hash-code: ${{ steps.hash-code.outputs.hash-code }}
      dms-version: ${{ steps.versions.outputs.dms-v }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Set DMS Version Numbers
        id: versions
        run: |
          Import-Module ./package-helpers.psm1
          Get-VersionNumber -projectPrefix "dms"

      - name: Build DMS .NET Assemblies
        run: |
          $packageVersion = "${{ steps.versions.outputs.dms-semver }}" -replace "dms-v", ""

          ./build-dms.ps1 -Command BuildAndPublish `
              -Configuration Release `
              -DMSVersion $packageVersion `
              -LockedMode

      - name: Create SchemaTools NuGet Package
        run: |
          $packageVersion = "${{ steps.versions.outputs.dms-semver }}" -replace "dms-v", ""

          ./build-dms.ps1 -Command Package `
              -DMSVersion $packageVersion `
              -Configuration Release `
              -PackageTarget SchemaTools

      - name: Generate SchemaTools hash for NuGet package
        id: hash-code
        run: |
          $packageFile = "${{ env.SCHEMA_TOOLS_PACKAGE_NAME }}.${{ steps.versions.outputs.dms-v }}.nupkg"
          if (-not (Test-Path $packageFile)) {
            throw "Expected SchemaTools package was not found: $packageFile"
          }

          "hash-code=$(sha256sum $packageFile | base64 -w0)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload SchemaTools Package as Artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.SCHEMA_TOOLS_PACKAGE_NAME }}-NuGet"
          path: ${{ github.workspace }}/${{ env.SCHEMA_TOOLS_PACKAGE_NAME }}.${{ steps.versions.outputs.dms-v }}.nupkg
          if-no-files-found: error
          retention-days: 30

  sbom-create-dms:
    name: Create DMS SBOM
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    needs: pack-dms
    permissions:
      actions: read
      contents: write
    outputs:
      sbom-hash-code: ${{ steps.sbom-hash-code.outputs.sbom-hash-code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get DMS Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.DMS_PACKAGE_NAME }}-NuGet

      - name: Generate DMS Software Bill of Materials (SBOM)
        run: |
          $packageName = "${{ env.DMS_PACKAGE_NAME }}"
          $version = "${{ needs.pack-dms.outputs.dms-version }}"

          $packageFile = "$packageName.$version.nupkg"
          if (-not (Test-Path $packageFile)) {
            throw "Expected DMS package was not found: $packageFile"
          }
          (Resolve-Path $packageFile).Path > buildfilelist.txt

          dotnet tool install --global Microsoft.Sbom.DotNetTool

          sbom-tool generate `
              -b ./ `
              -bl ./buildfilelist.txt `
              -bc "./" `
              -pn "$packageName" `
              -pv $version `
              -nsb https://ed-fi.org `
              -m ./ `
              -ps "Ed-Fi Alliance"

          cp _manifest/spdx_2.2/manifest.spdx.* .

      - name: Upload DMS SBOM
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.DMS_PACKAGE_NAME }}-SBOM
          path: ${{ env.MANIFEST_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Generate DMS hash code for SBOM
        id: sbom-hash-code
        shell: bash
        run: |
          # sha256sum returns "<hashcode>  <name of file". Split that and return only the <hashcode>.
          sbom_hash=$(sha256sum ./${{ env.MANIFEST_FILE }} | awk '{split($0,a); print a[1]}')
          echo "sbom-hash-code=$sbom_hash" >> $GITHUB_OUTPUT

  sbom-create-schema-tools:
    name: Create SchemaTools SBOM
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    needs: pack-schema-tools
    permissions:
      actions: read
      contents: write
    outputs:
      sbom-hash-code: ${{ steps.sbom-hash-code.outputs.sbom-hash-code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get SchemaTools Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.SCHEMA_TOOLS_PACKAGE_NAME }}-NuGet

      - name: Generate SchemaTools Software Bill of Materials (SBOM)
        run: |
          $packageName = "${{ env.SCHEMA_TOOLS_PACKAGE_NAME }}"
          $version = "${{ needs.pack-schema-tools.outputs.dms-version }}"
          $packageFile = "$packageName.$version.nupkg"
          if (-not (Test-Path $packageFile)) {
            throw "Expected SchemaTools package was not found: $packageFile"
          }
          (Resolve-Path $packageFile).Path > buildfilelist.txt

          dotnet tool install --global Microsoft.Sbom.DotNetTool

          sbom-tool generate `
              -b ./ `
              -bl ./buildfilelist.txt `
              -bc "./" `
              -pn "$packageName" `
              -pv $version `
              -nsb https://ed-fi.org `
              -m ./ `
              -ps "Ed-Fi Alliance"

          cp _manifest/spdx_2.2/manifest.spdx.* .

      - name: Upload SchemaTools SBOM
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.SCHEMA_TOOLS_PACKAGE_NAME }}-SBOM
          path: ${{ env.MANIFEST_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Generate SchemaTools hash code for SBOM
        id: sbom-hash-code
        shell: bash
        run: |
          sbom_hash=$(sha256sum ./${{ env.MANIFEST_FILE }} | awk '{split($0,a); print a[1]}')
          echo "sbom-hash-code=$sbom_hash" >> $GITHUB_OUTPUT

  provenance-create-dms:
    name: Create DMS Provenance
    needs: pack-dms
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: Ed-Fi-Alliance-OSS/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.pack-dms.outputs.hash-code }}
      provenance-name: edfiApi.intoto.jsonl
      upload-assets: false
      # TODO: remove this after this issue is resolved: https://github.com/slsa-framework/slsa-github-generator/issues/876
      compile-generator: true

  provenance-create-schema-tools:
    name: Create SchemaTools Provenance
    needs: pack-schema-tools
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: Ed-Fi-Alliance-OSS/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.pack-schema-tools.outputs.hash-code }}
      provenance-name: edfiApiSchemaTools.intoto.jsonl
      upload-assets: false
      compile-generator: true

  publish-package-dms:
    name: Publish DMS NuGet Package
    needs: pack-dms
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get DMS Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.DMS_PACKAGE_NAME }}-NuGet

      - name: Install-credential-handler DMS
        run: |
            Import-Module ./package-helpers.psm1
            InstallCredentialHandler

      - name: Push DMS Package to Azure Artifacts
        run: |
          $packageFile = "${{ env.DMS_PACKAGE_NAME }}.${{ needs.pack-dms.outputs.dms-version }}.nupkg"
          if (-not (Test-Path $packageFile)) {
            throw "Expected DMS package was not found: $packageFile"
          }

          $arguments = @{
            EdFiNuGetFeed = "${{ env.ARTIFACTS_FEED_URL }}"
            NuGetApiKey = "${{ env.ARTIFACTS_API_KEY }}"
            PackageFile = $packageFile
          }

          ./build-dms.ps1 Push @arguments

  publish-package-schema-tools:
    name: Publish SchemaTools NuGet Package
    needs: pack-schema-tools
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get SchemaTools Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.SCHEMA_TOOLS_PACKAGE_NAME }}-NuGet

      - name: Install-credential-handler SchemaTools
        run: |
          Import-Module ./package-helpers.psm1
          InstallCredentialHandler

      - name: Push SchemaTools Package to Azure Artifacts
        run: |
          $packageFile = "${{ env.SCHEMA_TOOLS_PACKAGE_NAME }}.${{ needs.pack-schema-tools.outputs.dms-version }}.nupkg"
          if (-not (Test-Path $packageFile)) {
            throw "Expected SchemaTools package was not found: $packageFile"
          }

          $arguments = @{
            EdFiNuGetFeed = "${{ env.ARTIFACTS_FEED_URL }}"
            NuGetApiKey = "${{ env.ARTIFACTS_API_KEY }}"
            PackageFile = $packageFile
          }

          ./build-dms.ps1 Push @arguments

  # The two contract chains. Each is the shape EdFi.Api and EdFi.Api.SchemaTools already have -
  # pack exposing hash-code, an SPDX 2.2 SBOM exposing sbom-hash-code, SLSA provenance with a name
  # of its own, and a publish job - with one difference that runs through all of it: a contract is
  # packed and published at the version its own project declares, never at the release version.
  #
  # That is also why the publish jobs consult Invoke-ContractPublishCheck rather than pushing.
  # This workflow fires on every prerelease while a contract's version deliberately does not move,
  # so the same version is offered to the feed again and again.
  pack-plugins:
    name: Build and Pack Plugins Contract
    # A dispatch reaches this job as well as a dms- prerelease: the dispatch is the dry run the
    # trigger comment describes, and this pack, its SBOM and its provenance are what it exercises.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'dms-') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      hash-code: ${{ steps.hash-code.outputs.hash-code }}
      contract-version: ${{ steps.contract-version.outputs.contract-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Set DMS Version Numbers
        id: versions
        run: |
          Import-Module ./package-helpers.psm1
          Get-VersionNumber -projectPrefix "dms"

      - name: Read Plugins Contract Version
        id: contract-version
        run: |
          $ErrorActionPreference = "Stop"

          # The contract's own declared version, read from the file the compiler reads. Every step
          # below names the package by this value rather than by the release version.
          Import-Module ./package-helpers.psm1
          $contractVersion = Get-PluginsContractVersion

          "contract-version=$contractVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build DMS .NET Assemblies
        run: |
          $packageVersion = "${{ steps.versions.outputs.dms-semver }}" -replace "dms-v", ""

          ./build-dms.ps1 -Command BuildAndPublish `
              -Configuration Release `
              -DMSVersion $packageVersion `
              -LockedMode

      - name: Create Plugins NuGet Package
        run: |
          # No -DMSVersion, and the target would ignore one anyway: BuildPluginsPackage passes no
          # -p:PackageVersion at all, so the version comes from src/plugins/Directory.Build.props
          # whatever this command line says. Omitted so the command states what actually decides.
          ./build-dms.ps1 -Command Package `
              -Configuration Release `
              -PackageTarget Plugins

      - name: Assert Plugins Package Contents
        run: |
          $ErrorActionPreference = "Stop"

          # Before anything is uploaded, and therefore before anything can be published: this is the
          # check that decides what the first published version of this contract contains.
          ./eng/verification/Assert-PluginsPackage.ps1 `
            -PackageFile "${{ env.PLUGINS_PACKAGE_NAME }}.${{ steps.contract-version.outputs.contract-version }}.nupkg" `
            -ExtractTo (Join-Path $env:RUNNER_TEMP "plugins-nupkg-$([guid]::NewGuid().ToString('N'))") `
            -PackageId "${{ env.PLUGINS_PACKAGE_NAME }}" `
            -ExpectedPackageVersion "${{ steps.contract-version.outputs.contract-version }}"

      - name: Generate Plugins hash for NuGet package
        id: hash-code
        run: |
          $packageFile = "${{ env.PLUGINS_PACKAGE_NAME }}.${{ steps.contract-version.outputs.contract-version }}.nupkg"
          if (-not (Test-Path $packageFile)) {
            throw "Expected plugin contract package was not found: $packageFile"
          }

          "hash-code=$(sha256sum $packageFile | base64 -w0)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Plugins Package as Artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.PLUGINS_PACKAGE_NAME }}-NuGet"
          path: ${{ github.workspace }}/${{ env.PLUGINS_PACKAGE_NAME }}.${{ steps.contract-version.outputs.contract-version }}.nupkg
          if-no-files-found: error
          retention-days: 30

  pack-custom-validation:
    name: Build and Pack Custom Validation Contract
    # Same as pack-plugins: a dispatch is the dry run, and this is one of the two chains it runs.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'dms-') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      hash-code: ${{ steps.hash-code.outputs.hash-code }}
      contract-version: ${{ steps.contract-version.outputs.contract-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Set DMS Version Numbers
        id: versions
        run: |
          Import-Module ./package-helpers.psm1
          Get-VersionNumber -projectPrefix "dms"

      - name: Read Custom Validation Contract Version
        id: contract-version
        run: |
          $ErrorActionPreference = "Stop"

          Import-Module ./package-helpers.psm1
          $contractVersion = Get-CustomValidationContractVersion

          "contract-version=$contractVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build DMS .NET Assemblies
        run: |
          $packageVersion = "${{ steps.versions.outputs.dms-semver }}" -replace "dms-v", ""

          # BuildAndPublish regenerates src/dms/Directory.Build.props with this release version, so
          # the contract below is packed out of a release-stamped tree. Its csproj is what holds the
          # contract's version against that, and the assertion two steps down is what proves it.
          ./build-dms.ps1 -Command BuildAndPublish `
              -Configuration Release `
              -DMSVersion $packageVersion `
              -LockedMode

      - name: Create Custom Validation NuGet Package
        run: |
          $packageVersion = "${{ steps.versions.outputs.dms-semver }}" -replace "dms-v", ""

          # -DMSVersion is passed deliberately, and is deliberately the wrong version for this
          # package: it is the release version, and the assertion below requires the artifact to
          # carry the contract's own. Removing it would remove what is being disproved.
          ./build-dms.ps1 -Command Package `
              -DMSVersion $packageVersion `
              -Configuration Release `
              -PackageTarget CustomValidation

      - name: Assert Custom Validation Package Contents
        run: |
          $ErrorActionPreference = "Stop"

          ./eng/verification/Assert-CustomValidationPackage.ps1 `
            -PackageFile "${{ env.CUSTOM_VALIDATION_PACKAGE_NAME }}.${{ steps.contract-version.outputs.contract-version }}.nupkg" `
            -ExtractTo (Join-Path $env:RUNNER_TEMP "custom-validation-nupkg-$([guid]::NewGuid().ToString('N'))") `
            -PackageId "${{ env.CUSTOM_VALIDATION_PACKAGE_NAME }}" `
            -ExpectedPackageVersion "${{ steps.contract-version.outputs.contract-version }}"

      - name: Generate Custom Validation hash for NuGet package
        id: hash-code
        run: |
          $packageFile = "${{ env.CUSTOM_VALIDATION_PACKAGE_NAME }}.${{ steps.contract-version.outputs.contract-version }}.nupkg"
          if (-not (Test-Path $packageFile)) {
            throw "Expected custom-validation package was not found: $packageFile"
          }

          "hash-code=$(sha256sum $packageFile | base64 -w0)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Custom Validation Package as Artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.CUSTOM_VALIDATION_PACKAGE_NAME }}-NuGet"
          path: ${{ github.workspace }}/${{ env.CUSTOM_VALIDATION_PACKAGE_NAME }}.${{ steps.contract-version.outputs.contract-version }}.nupkg
          if-no-files-found: error
          retention-days: 30

  sbom-create-plugins:
    name: Create Plugins Contract SBOM
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    needs: pack-plugins
    permissions:
      actions: read
      contents: write
    outputs:
      sbom-hash-code: ${{ steps.sbom-hash-code.outputs.sbom-hash-code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Plugins Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PLUGINS_PACKAGE_NAME }}-NuGet

      - name: Generate Plugins Software Bill of Materials (SBOM)
        run: |
          $packageName = "${{ env.PLUGINS_PACKAGE_NAME }}"
          $version = "${{ needs.pack-plugins.outputs.contract-version }}"

          $packageFile = "$packageName.$version.nupkg"
          if (-not (Test-Path $packageFile)) {
            throw "Expected plugin contract package was not found: $packageFile"
          }
          (Resolve-Path $packageFile).Path > buildfilelist.txt

          dotnet tool install --global Microsoft.Sbom.DotNetTool

          sbom-tool generate `
              -b ./ `
              -bl ./buildfilelist.txt `
              -bc "./" `
              -pn "$packageName" `
              -pv $version `
              -nsb https://ed-fi.org `
              -m ./ `
              -ps "Ed-Fi Alliance"

          cp _manifest/spdx_2.2/manifest.spdx.* .

      - name: Upload Plugins SBOM
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PLUGINS_PACKAGE_NAME }}-SBOM
          path: ${{ env.MANIFEST_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Generate Plugins hash code for SBOM
        id: sbom-hash-code
        shell: bash
        run: |
          sbom_hash=$(sha256sum "./${{ env.MANIFEST_FILE }}" | awk '{split($0,a); print a[1]}')
          echo "sbom-hash-code=$sbom_hash" >> "$GITHUB_OUTPUT"

  sbom-create-custom-validation:
    name: Create Custom Validation Contract SBOM
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    needs: pack-custom-validation
    permissions:
      actions: read
      contents: write
    outputs:
      sbom-hash-code: ${{ steps.sbom-hash-code.outputs.sbom-hash-code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Custom Validation Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.CUSTOM_VALIDATION_PACKAGE_NAME }}-NuGet

      - name: Generate Custom Validation Software Bill of Materials (SBOM)
        run: |
          $packageName = "${{ env.CUSTOM_VALIDATION_PACKAGE_NAME }}"
          $version = "${{ needs.pack-custom-validation.outputs.contract-version }}"

          $packageFile = "$packageName.$version.nupkg"
          if (-not (Test-Path $packageFile)) {
            throw "Expected custom-validation package was not found: $packageFile"
          }
          (Resolve-Path $packageFile).Path > buildfilelist.txt

          dotnet tool install --global Microsoft.Sbom.DotNetTool

          sbom-tool generate `
              -b ./ `
              -bl ./buildfilelist.txt `
              -bc "./" `
              -pn "$packageName" `
              -pv $version `
              -nsb https://ed-fi.org `
              -m ./ `
              -ps "Ed-Fi Alliance"

          cp _manifest/spdx_2.2/manifest.spdx.* .

      - name: Upload Custom Validation SBOM
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.CUSTOM_VALIDATION_PACKAGE_NAME }}-SBOM
          path: ${{ env.MANIFEST_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Generate Custom Validation hash code for SBOM
        id: sbom-hash-code
        shell: bash
        run: |
          sbom_hash=$(sha256sum "./${{ env.MANIFEST_FILE }}" | awk '{split($0,a); print a[1]}')
          echo "sbom-hash-code=$sbom_hash" >> "$GITHUB_OUTPUT"

  provenance-create-plugins:
    name: Create Plugins Contract Provenance
    needs: pack-plugins
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: Ed-Fi-Alliance-OSS/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.pack-plugins.outputs.hash-code }}
      provenance-name: edfiApiPlugins.intoto.jsonl
      upload-assets: false
      compile-generator: true

  provenance-create-custom-validation:
    name: Create Custom Validation Contract Provenance
    needs: pack-custom-validation
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: Ed-Fi-Alliance-OSS/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.pack-custom-validation.outputs.hash-code }}
      provenance-name: edfiApiCustomValidation.intoto.jsonl
      upload-assets: false
      compile-generator: true

  # The two read-only publish decisions, separate from the mutation so they can gate what ships the
  # contract DLLs. pack-dms and pack-schema-tools need both: EdFi.Api and the SchemaTools tool
  # package carry both contract assemblies, and a contract refused at its declared version must not
  # be built into a release artifact. A dispatch runs these against the live feed and mutates
  # nothing, which gives the dry run coverage of the decision path.
  check-plugins-contract:
    name: Check Plugins Contract Against the Feed
    needs: pack-plugins
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'dms-') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      should-push: ${{ steps.decide.outputs.should-push }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Get Plugins Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PLUGINS_PACKAGE_NAME }}-NuGet

      - name: Decide Whether the Plugins Contract May Be Published
        id: decide
        run: |
          $ErrorActionPreference = "Stop"

          # Publish when absent, skip when unchanged, fail when changed. Reads the feed only. The
          # output helper refuses anything but exactly one well-formed decision before it writes.
          ./eng/verification/Invoke-ContractPublishCheck.ps1 `
            -PackageFile "${{ env.PLUGINS_PACKAGE_NAME }}.${{ needs.pack-plugins.outputs.contract-version }}.nupkg" `
            -PackageId "${{ env.PLUGINS_PACKAGE_NAME }}" `
            -PackageVersion "${{ needs.pack-plugins.outputs.contract-version }}" `
            -WorkingDirectory (Join-Path $env:RUNNER_TEMP "plugins-check-$([guid]::NewGuid().ToString('N'))") `
            -ServiceIndexUrl "${{ env.ARTIFACTS_FEED_URL }}" `
            -FeedApiKey "${{ env.ARTIFACTS_API_KEY }}" |
            ./eng/verification/Write-ContractPublishOutput.ps1 -ExpectedMode decide |
            Out-Null

  check-custom-validation-contract:
    name: Check Custom Validation Contract Against the Feed
    needs: pack-custom-validation
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'dms-') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      should-push: ${{ steps.decide.outputs.should-push }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Get Custom Validation Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.CUSTOM_VALIDATION_PACKAGE_NAME }}-NuGet

      - name: Decide Whether the Custom Validation Contract May Be Published
        id: decide
        run: |
          $ErrorActionPreference = "Stop"

          ./eng/verification/Invoke-ContractPublishCheck.ps1 `
            -PackageFile "${{ env.CUSTOM_VALIDATION_PACKAGE_NAME }}.${{ needs.pack-custom-validation.outputs.contract-version }}.nupkg" `
            -PackageId "${{ env.CUSTOM_VALIDATION_PACKAGE_NAME }}" `
            -PackageVersion "${{ needs.pack-custom-validation.outputs.contract-version }}" `
            -WorkingDirectory (Join-Path $env:RUNNER_TEMP "custom-validation-check-$([guid]::NewGuid().ToString('N'))") `
            -ServiceIndexUrl "${{ env.ARTIFACTS_FEED_URL }}" `
            -FeedApiKey "${{ env.ARTIFACTS_API_KEY }}" |
            ./eng/verification/Write-ContractPublishOutput.ps1 -ExpectedMode decide |
            Out-Null

  # The generator keeps its provenance artifact for five days: generator_generic_slsa3.yml uploads
  # it with retention-days 5 and exposes no input to change that. A contract's evidence is attached
  # only by the run that confirmed the feed serves its bytes, so when that run is an alpha
  # prerelease, or when the final release's own run repacks, the original envelope is what
  # Invoke-ContractEvidenceBackfill.ps1 has to retrieve later. These jobs keep the same file,
  # unchanged, under a second name for thirty days: download and upload only, no checkout, nothing
  # decoded or rewritten. They run on every run that produced provenance, dispatch and alpha included.
  preserve-provenance-plugins:
    name: Retain Plugins Contract Provenance
    needs: provenance-create-plugins
    runs-on: ubuntu-latest
    outputs:
      provenance-sha256: ${{ steps.digest.outputs.provenance-sha256 }}
    steps:
      - name: Get Plugins Provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: edfiApiPlugins.intoto.jsonl

      - name: Record the Envelope Digest
        id: digest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $digest = (Get-FileHash -LiteralPath "edfiApiPlugins.intoto.jsonl" -Algorithm SHA256).Hash.ToLowerInvariant()
          "provenance-sha256=$digest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "Retained edfiApiPlugins.intoto.jsonl (SHA-256 $digest) as edfiApiPlugins.intoto.jsonl-retained for 30 days." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Retain Plugins Provenance for 30 Days
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edfiApiPlugins.intoto.jsonl-retained
          path: edfiApiPlugins.intoto.jsonl
          if-no-files-found: error
          retention-days: 30

  preserve-provenance-custom-validation:
    name: Retain Custom Validation Contract Provenance
    needs: provenance-create-custom-validation
    runs-on: ubuntu-latest
    outputs:
      provenance-sha256: ${{ steps.digest.outputs.provenance-sha256 }}
    steps:
      - name: Get Custom Validation Provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: edfiApiCustomValidation.intoto.jsonl

      - name: Record the Envelope Digest
        id: digest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $digest = (Get-FileHash -LiteralPath "edfiApiCustomValidation.intoto.jsonl" -Algorithm SHA256).Hash.ToLowerInvariant()
          "provenance-sha256=$digest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "Retained edfiApiCustomValidation.intoto.jsonl (SHA-256 $digest) as edfiApiCustomValidation.intoto.jsonl-retained for 30 days." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Retain Custom Validation Provenance for 30 Days
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edfiApiCustomValidation.intoto.jsonl-retained
          path: edfiApiCustomValidation.intoto.jsonl
          if-no-files-found: error
          retention-days: 30

  publish-package-plugins:
    name: Publish Plugins Contract NuGet Package
    needs:
      - pack-plugins
      - check-plugins-contract
    # Not on a dispatch. The pack and check jobs above do run on one, so without this the dry run
    # would push the package; the push lives in this job and nowhere else, so skipping it is what
    # makes the dispatch a dry run.
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      # Whether this job pushed, from the recheck immediately before the push.
      should-push: ${{ steps.decide.outputs.should-push }}
      # Whether the feed now serves exactly the bytes this run packed, from the confirm step that
      # reads the feed again after the push or the skip. It is the only output the evidence job
      # trusts: a decision to push is not a publication, and a rerun of this job that pushes nothing
      # still confirms when the feed already holds this run's bytes.
      attach-evidence: ${{ steps.confirm.outputs.attach-evidence }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Get Plugins Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PLUGINS_PACKAGE_NAME }}-NuGet

      - name: Recheck Immediately Before Pushing
        id: decide
        run: |
          $ErrorActionPreference = "Stop"

          # The same decision check-plugins-contract made, taken again here so that a rerun of this
          # job after a completed push finds the version present and does not push twice.
          ./eng/verification/Invoke-ContractPublishCheck.ps1 `
            -PackageFile "${{ env.PLUGINS_PACKAGE_NAME }}.${{ needs.pack-plugins.outputs.contract-version }}.nupkg" `
            -PackageId "${{ env.PLUGINS_PACKAGE_NAME }}" `
            -PackageVersion "${{ needs.pack-plugins.outputs.contract-version }}" `
            -WorkingDirectory (Join-Path $env:RUNNER_TEMP "plugins-publish-decide-$([guid]::NewGuid().ToString('N'))") `
            -ServiceIndexUrl "${{ env.ARTIFACTS_FEED_URL }}" `
            -FeedApiKey "${{ env.ARTIFACTS_API_KEY }}" |
            ./eng/verification/Write-ContractPublishOutput.ps1 -ExpectedMode decide |
            Out-Null

      - name: Install-credential-handler Plugins
        if: steps.decide.outputs.should-push == 'true'
        run: |
          Import-Module ./package-helpers.psm1
          InstallCredentialHandler

      - name: Push Plugins Package to Azure Artifacts
        if: steps.decide.outputs.should-push == 'true'
        run: |
          $packageFile = "${{ env.PLUGINS_PACKAGE_NAME }}.${{ needs.pack-plugins.outputs.contract-version }}.nupkg"
          if (-not (Test-Path $packageFile)) {
            throw "Expected plugin contract package was not found: $packageFile"
          }

          $arguments = @{
            EdFiNuGetFeed = "${{ env.ARTIFACTS_FEED_URL }}"
            NuGetApiKey = "${{ env.ARTIFACTS_API_KEY }}"
            PackageFile = $packageFile
          }

          ./build-dms.ps1 Push @arguments

      - name: Confirm the Feed Serves This Run's Bytes
        id: confirm
        run: |
          $ErrorActionPreference = "Stop"

          # After the push, or after a clean skip, and only when every step before it succeeded: a
          # failed push never reaches this. The version must now be listed; a healthy feed that has
          # not indexed a fresh push yet is polled for up to a minute, any other failure is fatal.
          # The three comparisons run again, and attach-evidence is true only when the archive the
          # feed serves is byte-identical to the file this run packed.
          ./eng/verification/Invoke-ContractPublishCheck.ps1 `
            -PackageFile "${{ env.PLUGINS_PACKAGE_NAME }}.${{ needs.pack-plugins.outputs.contract-version }}.nupkg" `
            -PackageId "${{ env.PLUGINS_PACKAGE_NAME }}" `
            -PackageVersion "${{ needs.pack-plugins.outputs.contract-version }}" `
            -WorkingDirectory (Join-Path $env:RUNNER_TEMP "plugins-publish-confirm-$([guid]::NewGuid().ToString('N'))") `
            -ServiceIndexUrl "${{ env.ARTIFACTS_FEED_URL }}" `
            -FeedApiKey "${{ env.ARTIFACTS_API_KEY }}" `
            -ConfirmPublished |
            ./eng/verification/Write-ContractPublishOutput.ps1 -ExpectedMode confirm |
            Out-Null

  publish-package-custom-validation:
    name: Publish Custom Validation Contract NuGet Package
    needs:
      - pack-custom-validation
      - check-custom-validation-contract
    # Not on a dispatch, for the reason publish-package-plugins records: the push is here, and a
    # dry run must not push.
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      # Same two outputs as publish-package-plugins, for the same reasons.
      should-push: ${{ steps.decide.outputs.should-push }}
      attach-evidence: ${{ steps.confirm.outputs.attach-evidence }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Get Custom Validation Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.CUSTOM_VALIDATION_PACKAGE_NAME }}-NuGet

      - name: Recheck Immediately Before Pushing
        id: decide
        run: |
          $ErrorActionPreference = "Stop"

          ./eng/verification/Invoke-ContractPublishCheck.ps1 `
            -PackageFile "${{ env.CUSTOM_VALIDATION_PACKAGE_NAME }}.${{ needs.pack-custom-validation.outputs.contract-version }}.nupkg" `
            -PackageId "${{ env.CUSTOM_VALIDATION_PACKAGE_NAME }}" `
            -PackageVersion "${{ needs.pack-custom-validation.outputs.contract-version }}" `
            -WorkingDirectory (Join-Path $env:RUNNER_TEMP "custom-validation-publish-decide-$([guid]::NewGuid().ToString('N'))") `
            -ServiceIndexUrl "${{ env.ARTIFACTS_FEED_URL }}" `
            -FeedApiKey "${{ env.ARTIFACTS_API_KEY }}" |
            ./eng/verification/Write-ContractPublishOutput.ps1 -ExpectedMode decide |
            Out-Null

      - name: Install-credential-handler Custom Validation
        if: steps.decide.outputs.should-push == 'true'
        run: |
          Import-Module ./package-helpers.psm1
          InstallCredentialHandler

      - name: Push Custom Validation Package to Azure Artifacts
        if: steps.decide.outputs.should-push == 'true'
        run: |
          $packageFile = "${{ env.CUSTOM_VALIDATION_PACKAGE_NAME }}.${{ needs.pack-custom-validation.outputs.contract-version }}.nupkg"
          if (-not (Test-Path $packageFile)) {
            throw "Expected custom-validation package was not found: $packageFile"
          }

          $arguments = @{
            EdFiNuGetFeed = "${{ env.ARTIFACTS_FEED_URL }}"
            NuGetApiKey = "${{ env.ARTIFACTS_API_KEY }}"
            PackageFile = $packageFile
          }

          ./build-dms.ps1 Push @arguments

      - name: Confirm the Feed Serves This Run's Bytes
        id: confirm
        run: |
          $ErrorActionPreference = "Stop"

          ./eng/verification/Invoke-ContractPublishCheck.ps1 `
            -PackageFile "${{ env.CUSTOM_VALIDATION_PACKAGE_NAME }}.${{ needs.pack-custom-validation.outputs.contract-version }}.nupkg" `
            -PackageId "${{ env.CUSTOM_VALIDATION_PACKAGE_NAME }}" `
            -PackageVersion "${{ needs.pack-custom-validation.outputs.contract-version }}" `
            -WorkingDirectory (Join-Path $env:RUNNER_TEMP "custom-validation-publish-confirm-$([guid]::NewGuid().ToString('N'))") `
            -ServiceIndexUrl "${{ env.ARTIFACTS_FEED_URL }}" `
            -FeedApiKey "${{ env.ARTIFACTS_API_KEY }}" `
            -ConfirmPublished |
            ./eng/verification/Write-ContractPublishOutput.ps1 -ExpectedMode confirm |
            Out-Null

  # dms-pre and dms-*-alpha releases, will not have artifacts attached.
  # This step attach DMS artifacts to the release with tag vX.Y.Z without 'alpha' or 'pre' in the tag name.
  attach-dms-artifacts-to-release:
    name: Attach DMS Artifacts to GitHub Release
    runs-on: ubuntu-latest
    needs:
      - pack-dms
      - sbom-create-dms
      - provenance-create-dms
      - sbom-create-schema-tools
      - provenance-create-schema-tools
    if: ${{ startsWith(github.event.release.tag_name, 'dms-') && !contains(github.event.release.tag_name, 'alpha') }}
    permissions:
      contents: write
    steps:
      - name: Prepare release version
        id: prepare-version
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"

          # Remove 'dms-pre-' prefix and add 'v' to match release format
          SEMVER="v${TAG_NAME#dms-pre-}"

          echo "semver=$SEMVER" >> $GITHUB_OUTPUT
          echo "Release version: $SEMVER"

      - name: Download DMS SBOM
        uses: Ed-Fi-Alliance-OSS/slsa-github-generator/.github/actions/secure-download-artifact@v2.0.0
        with:
          name: "${{ env.DMS_PACKAGE_NAME }}-SBOM"
          path: ${{ env.MANIFEST_FILE }}
          sha256: "${{ needs.sbom-create-dms.outputs.sbom-hash-code }}"

      - name: Download DMS Provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: edfiApi.intoto.jsonl

      - name: Prepare SchemaTools SBOM download directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force schematools/_manifest/spdx_2.2 | Out-Null

      - name: Download SchemaTools SBOM
        uses: Ed-Fi-Alliance-OSS/slsa-github-generator/.github/actions/secure-download-artifact@v2.0.0
        with:
          name: "${{ env.SCHEMA_TOOLS_PACKAGE_NAME }}-SBOM"
          path: schematools/${{ env.MANIFEST_FILE }}
          sha256: "${{ needs.sbom-create-schema-tools.outputs.sbom-hash-code }}"

      - name: Download SchemaTools Provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: edfiApiSchemaTools.intoto.jsonl

      - name: Attach DMS SBOM and Provenance to release
        shell: pwsh
        run: |
          $release = "${{ steps.prepare-version.outputs.semver }}"
          $repo = "${{ github.repository }}"
          $token = "${{ secrets.GITHUB_TOKEN }}"

          $url = "https://api.github.com/repos/$repo/releases/tags/$release"
          $gh_headers = @{
              "Accept"        = "application/vnd.github+json"
              "Authorization" = "Bearer $token"
          }
          $response = Invoke-RestMethod -Uri $url -Headers $gh_headers
          $releaseId = $response.id

          # Upload SBOM
          $sbomFile = "${{ env.MANIFEST_FILE }}"
          $sbomUploadName = "${{ env.DMS_PACKAGE_NAME }}-SBOM.zip"

          Compress-Archive $sbomFile -DestinationPath $sbomUploadName

          $uploadUrl = "https://uploads.github.com/repos/$repo/releases/$releaseId/assets"
          $gh_headers["Content-Type"] = "application/octet-stream"

          Write-Host "Uploading SBOM as $sbomUploadName"
          Invoke-RestMethod -Method POST `
              -Uri "$($uploadUrl)?name=$($sbomUploadName)" `
              -Headers $gh_headers `
              -InFile $sbomUploadName

          # Upload Provenance
          $provenanceFile = "edfiApi.intoto.jsonl"
          $provenanceUploadName = "edfiApi.intoto.jsonl"

          Write-Host "Uploading Provenance as $provenanceUploadName"
          Invoke-RestMethod -Method POST `
              -Uri "$($uploadUrl)?name=$($provenanceUploadName)" `
              -Headers $gh_headers `
              -InFile $provenanceFile

          # Upload SchemaTools SBOM
          $schemaToolsSbomFile = "schematools/${{ env.MANIFEST_FILE }}"
          $schemaToolsSbomUploadName = "${{ env.SCHEMA_TOOLS_PACKAGE_NAME }}-SBOM.zip"

          Compress-Archive $schemaToolsSbomFile -DestinationPath $schemaToolsSbomUploadName

          Write-Host "Uploading SchemaTools SBOM as $schemaToolsSbomUploadName"
          Invoke-RestMethod -Method POST `
              -Uri "$($uploadUrl)?name=$($schemaToolsSbomUploadName)" `
              -Headers $gh_headers `
              -InFile $schemaToolsSbomUploadName

          # Upload SchemaTools Provenance
          $schemaToolsProvenanceFile = "edfiApiSchemaTools.intoto.jsonl"
          $schemaToolsProvenanceUploadName = "edfiApiSchemaTools.intoto.jsonl"

          Write-Host "Uploading SchemaTools Provenance as $schemaToolsProvenanceUploadName"
          Invoke-RestMethod -Method POST `
              -Uri "$($uploadUrl)?name=$($schemaToolsProvenanceUploadName)" `
              -Headers $gh_headers `
              -InFile $schemaToolsProvenanceFile

  # One evidence job per contract, depending only on that contract's own producers and publisher,
  # so neither contract's failure can suppress the other's evidence or the DMS job above.
  # !cancelled() rather than the default success gate: a failed or skipped publisher, or a failed
  # SBOM or provenance job, is inspected by Test-ContractEvidenceAttachable.ps1 and read as "nothing
  # to attach" with the reason in the log, instead of skipping this job silently. Every step that
  # reads an artifact or touches the release is gated on that helper's decision; a cancelled run
  # still skips the job.
  #
  # Evidence attaches when the publisher's confirm step proved the feed serves exactly the bytes
  # this run packed - including a rerun of the publisher that pushed nothing because an earlier
  # attempt already had. A later prerelease that finds the version unchanged packs different bytes,
  # confirms nothing, and attaches nothing; the original run's evidence is then attached with
  # Invoke-ContractEvidenceBackfill.ps1, which is why the preserve-provenance jobs keep it.
  attach-plugins-contract-evidence-to-release:
    name: Attach Plugins Contract Evidence to GitHub Release
    runs-on: ubuntu-latest
    needs:
      - pack-plugins
      - sbom-create-plugins
      - provenance-create-plugins
      - publish-package-plugins
    if: ${{ !cancelled() && startsWith(github.event.release.tag_name, 'dms-') && !contains(github.event.release.tag_name, 'alpha') }}
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide Whether This Run's Evidence Describes the Published Bytes
        id: decide
        run: |
          $ErrorActionPreference = "Stop"

          ./eng/verification/Test-ContractEvidenceAttachable.ps1 `
            -PublishResult '${{ needs.publish-package-plugins.result }}' `
            -AttachEvidence '${{ needs.publish-package-plugins.outputs.attach-evidence }}' `
            -SbomResult '${{ needs.sbom-create-plugins.result }}' `
            -ProvenanceResult '${{ needs.provenance-create-plugins.result }}' |
            Out-Null

      - name: Prepare Plugins SBOM download directory
        if: steps.decide.outputs.attach == 'true'
        run: New-Item -ItemType Directory -Force plugins-sbom | Out-Null

      - name: Download Plugins SBOM
        if: steps.decide.outputs.attach == 'true'
        uses: Ed-Fi-Alliance-OSS/slsa-github-generator/.github/actions/secure-download-artifact@v2.0.0
        with:
          name: "${{ env.PLUGINS_PACKAGE_NAME }}-SBOM"
          path: plugins-sbom/manifest.spdx.json
          sha256: "${{ needs.sbom-create-plugins.outputs.sbom-hash-code }}"

      - name: Download Plugins Provenance
        if: steps.decide.outputs.attach == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: edfiApiPlugins.intoto.jsonl

      - name: Verify the Evidence Describes This Run's Package
        if: steps.decide.outputs.attach == 'true'
        run: |
          $ErrorActionPreference = "Stop"

          Import-Module ./eng/verification/ContractEvidence.psm1

          # The pack job's hash-code is the base64 of a sha256sum line. The SBOM job's sbom-hash-code
          # is the manifest's hex digest, already checked by the secure download above.
          $packageSha256 = ConvertFrom-Sha256SumBase64 -Value "${{ needs.pack-plugins.outputs.hash-code }}"
          $packageFileName = "${{ env.PLUGINS_PACKAGE_NAME }}.${{ needs.pack-plugins.outputs.contract-version }}.nupkg"

          # Bound to this repository, workflow file, commit and run id, and to the exact package file
          # and digest. Not to the run attempt: a rerun of failed jobs keeps the artifacts an earlier
          # successful attempt produced, so the envelope legitimately records that attempt.
          $envelope = Read-ProvenanceStatement -Path "edfiApiPlugins.intoto.jsonl"

          Assert-ProvenanceDescribesPackage `
            -Statement $envelope.Statement `
            -SubjectName $packageFileName `
            -SubjectSha256 $packageSha256 `
            -Repository "${{ github.repository }}" `
            -WorkflowPath ".github/workflows/on-prerelease.yml" `
            -HeadSha "${{ github.sha }}" `
            -RunId "${{ github.run_id }}"

          Assert-SbomDescribesPackage `
            -ManifestPath "plugins-sbom/manifest.spdx.json" `
            -PackageId "${{ env.PLUGINS_PACKAGE_NAME }}" `
            -PackageVersion "${{ needs.pack-plugins.outputs.contract-version }}" `
            -PackageFileName $packageFileName `
            -PackageSha256 $packageSha256

      - name: Resolve release id
        if: steps.decide.outputs.attach == 'true'
        id: release
        run: |
          $ErrorActionPreference = "Stop"

          $release = "v" + ("${{ github.event.release.tag_name }}" -replace "^dms-pre-", "")
          $gh_headers = @{
              "Accept"        = "application/vnd.github+json"
              "Authorization" = "Bearer ${{ secrets.GITHUB_TOKEN }}"
          }
          $response = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$release" -Headers $gh_headers

          "release-id=$($response.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Both uploads go through Publish-ReleaseAsset.ps1: an asset already there with the same
      # content is skipped, an interrupted upload is replaced, and an asset holding other bytes
      # fails rather than being overwritten, so a retry of this job is safe.
      - name: Attach Plugins SBOM to release
        if: steps.decide.outputs.attach == 'true'
        run: |
          $ErrorActionPreference = "Stop"

          Import-Module ./eng/verification/ContractEvidence.psm1

          $archive = New-SbomArchive `
            -ManifestPath "plugins-sbom/manifest.spdx.json" `
            -DestinationPath (Join-Path $env:RUNNER_TEMP "${{ env.PLUGINS_PACKAGE_NAME }}-SBOM.zip")

          ./eng/verification/Publish-ReleaseAsset.ps1 `
            -Repository "${{ github.repository }}" `
            -ReleaseId "${{ steps.release.outputs.release-id }}" `
            -AssetName "${{ env.PLUGINS_PACKAGE_NAME }}-SBOM.zip" `
            -FilePath $archive `
            -WorkingDirectory (Join-Path $env:RUNNER_TEMP "plugins-sbom-asset-$([guid]::NewGuid().ToString('N'))") `
            -Token "${{ secrets.GITHUB_TOKEN }}" `
            -ContentDigest { param([string] $Path) Get-SbomArchiveContentDigest -Path $Path } `
            -ExpectedDigest "${{ needs.sbom-create-plugins.outputs.sbom-hash-code }}" |
            Out-Null

      - name: Attach Plugins Provenance to release
        if: steps.decide.outputs.attach == 'true'
        run: |
          $ErrorActionPreference = "Stop"

          Import-Module ./eng/verification/ContractEvidence.psm1

          ./eng/verification/Publish-ReleaseAsset.ps1 `
            -Repository "${{ github.repository }}" `
            -ReleaseId "${{ steps.release.outputs.release-id }}" `
            -AssetName "edfiApiPlugins.intoto.jsonl" `
            -FilePath "edfiApiPlugins.intoto.jsonl" `
            -WorkingDirectory (Join-Path $env:RUNNER_TEMP "plugins-provenance-asset-$([guid]::NewGuid().ToString('N'))") `
            -Token "${{ secrets.GITHUB_TOKEN }}" `
            -ContentDigest { param([string] $Path) Get-ProvenanceContentDigest -Path $Path } |
            Out-Null

