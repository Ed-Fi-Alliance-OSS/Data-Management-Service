name: Scheduled pre Image Tests

on:
  workflow_dispatch:
  schedule:
  - cron: '30 8 * * 6' # Scheduled the job to run every Saturday at 8 AM UTC

permissions: read-all

jobs:
  test:
    name: pre Image Tests (${{ matrix.database_engine }}, ${{ matrix.identityprovider }})
    # Skip inherited schedules on forks; manual runs retain the full engine/identity matrix.
    if: (github.event_name != 'schedule' || github.repository_owner == 'Ed-Fi-Alliance-OSS')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    env:
      E2E_DATABASE_ENGINE: ${{ matrix.database_engine }}
      E2E_IDENTITY_PROVIDER: ${{ matrix.identityprovider }}
      E2E_DIAGNOSTIC_DIRECTORY: ${{ github.workspace }}/logs/scheduled-pre-image-${{ matrix.database_engine }}-${{ matrix.identityprovider }}
      E2E_TRX_PATH: ${{ github.workspace }}/TestResults/EdFi.DataManagementService.Tests.E2E.filtered.trx
    strategy:
      fail-fast: false
      matrix:
        database_engine: [postgresql, mssql]
        identityprovider: [keycloak, self-contained]
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache Nuget packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: DMS Build
        id: build_step
        run: ./build-dms.ps1 Build -Configuration Release -IdentityProvider ${{ matrix.identityprovider }}

      - name: Run DMS End to End Tests
        id: e2e
        if: success()
        continue-on-error: true
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $diagnosticDirectory = $env:E2E_DIAGNOSTIC_DIRECTORY
          New-Item -ItemType Directory -Path $diagnosticDirectory -Force | Out-Null
          $setupLog = Join-Path $diagnosticDirectory 'build-dms-setup.log'
          if (Test-Path -LiteralPath $env:E2E_TRX_PATH) {
            Remove-Item -LiteralPath $env:E2E_TRX_PATH -Force
          }

          $testFilter = switch ($env:E2E_DATABASE_ENGINE) {
            # The PostgreSQL leg uses DS 5.2 and MAXIMUM_PAGE_SIZE=500, so exclude DS 6.1
            # version-coupled scenarios, the local-compose-only DocumentCache fixture, and
            # partition sizing. DocumentCache runs with its explicit overlay in dms-weekend-build.yml.
            # Partition sizing runs per PR in run-e2e-tests-partition-sizing using
            # .env.cursorpartitions.e2e: its MAXIMUM_PAGE_SIZE=2 lets a collection seeded over
            # HTTP span multiple partitions.
            'postgresql' { '(Category!=@StandardVersion-6_1)&(Category!=@DocumentCacheHostedHappyPath)&(Category!=@CursorPartitionSizing)' }
            'mssql' { 'Category=@MssqlRepresentative' }
            default { throw 'Unsupported E2E database engine.' }
          }

          # Both non-empty filters write the filtered TRX used for execution evidence and upload.
          & pwsh -NoProfile -File ./build-dms.ps1 E2ETest `
            -UsePublishedImage `
            -Configuration Release `
            -DatabaseEngine $env:E2E_DATABASE_ENGINE `
            -IdentityProvider $env:E2E_IDENTITY_PROVIDER `
            -EnvironmentFile './.env.e2e' `
            -TestFilter $testFilter *> $setupLog
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            throw "Published-image E2E child process failed with exit code $buildExitCode."
          }

      - name: Capture DMS E2E Docker Logs
        id: capture
        if: always()
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $diagnosticDirectory = $env:E2E_DIAGNOSTIC_DIRECTORY
          New-Item -ItemType Directory -Path $diagnosticDirectory -Force | Out-Null
          $enumerationErrorPath = Join-Path $diagnosticDirectory 'docker-ps.err'
          $containerNames = @(docker ps -a --filter 'label=com.docker.compose.project=dms-published' --format '{{.Names}}' 2> $enumerationErrorPath)
          $dockerExitCode = $LASTEXITCODE
          if ($dockerExitCode -ne 0) {
            throw 'Docker container enumeration failed; diagnostic details were retained privately.'
          }

          foreach ($container in ($containerNames | Sort-Object)) {
            if ([string]::IsNullOrWhiteSpace($container)) { continue }
            $logPath = Join-Path $diagnosticDirectory "$container.log"
            docker logs $container *> $logPath
            $dockerExitCode = $LASTEXITCODE
            if ($dockerExitCode -ne 0) {
              throw 'Docker log capture failed; diagnostic details were retained privately.'
            }
          }

      - name: Teardown DMS E2E Environment
        id: teardown
        if: always()
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $diagnosticDirectory = $env:E2E_DIAGNOSTIC_DIRECTORY
          New-Item -ItemType Directory -Path $diagnosticDirectory -Force | Out-Null
          $teardownLog = Join-Path $diagnosticDirectory 'teardown.log'
          & pwsh -NoProfile -File ./src/dms/tests/EdFi.DataManagementService.Tests.E2E/teardown-local-dms.ps1 `
            -DatabaseEngine $env:E2E_DATABASE_ENGINE `
            -EnvironmentFile './.env.e2e' *> $teardownLog
          $teardownExitCode = $LASTEXITCODE
          if ($teardownExitCode -ne 0) {
            throw "DMS E2E teardown failed with exit code $teardownExitCode; details were retained privately."
          }

      - name: Sanitize DMS E2E Diagnostic Artifacts
        id: sanitize
        if: always()
        run: |
          try {
            ./eng/ci/sanitize-e2e-artifacts.ps1 -Path $env:E2E_DIAGNOSTIC_DIRECTORY
            ./eng/ci/sanitize-e2e-artifacts.ps1 -Path $env:E2E_TRX_PATH
          }
          catch {
            throw 'E2E artifact sanitization failed; raw diagnostic content was withheld.'
          }

      - name: Verify DMS E2E Execution
        id: evidence
        if: always() && steps.e2e.outcome == 'success' && steps.sanitize.outcome == 'success'
        run: |
          try {
            if (-not (Test-Path -LiteralPath $env:E2E_TRX_PATH -PathType Leaf)) {
              throw 'TRX file is missing.'
            }

            $readerSettings = [System.Xml.XmlReaderSettings]::new()
            $readerSettings.DtdProcessing = [System.Xml.DtdProcessing]::Prohibit
            $readerSettings.XmlResolver = $null
            $reader = [System.Xml.XmlReader]::Create($env:E2E_TRX_PATH, $readerSettings)
            try {
              $document = [System.Xml.XmlDocument]::new()
              $document.XmlResolver = $null
              $document.Load($reader)
            }
            finally {
              $reader.Dispose()
            }

            if ($null -eq $document.DocumentElement -or $document.DocumentElement.LocalName -ne 'TestRun') {
              throw 'TRX root is invalid.'
            }

            $summary = $document.DocumentElement.SelectSingleNode("./*[local-name()='ResultSummary']")
            $counters = if ($null -ne $summary) { $summary.SelectSingleNode("./*[local-name()='Counters']") } else { $null }
            if ($null -eq $counters -or -not $counters.HasAttribute('executed')) {
              throw 'TRX execution counter is missing.'
            }

            $executedCount = 0
            $executedIsInteger = [int]::TryParse(
              $counters.GetAttribute('executed'),
              [System.Globalization.NumberStyles]::None,
              [System.Globalization.CultureInfo]::InvariantCulture,
              [ref]$executedCount
            )
            if (-not $executedIsInteger -or $executedCount -le 0) {
              throw 'TRX execution counter is not positive.'
            }

            $passedResults = $document.SelectNodes("/*[local-name()='TestRun']/*[local-name()='Results']/*[local-name()='UnitTestResult'][@outcome='Passed']")
            if ($passedResults.Count -eq 0) {
              throw 'TRX has no passed test result.'
            }

            Write-Host "Validated E2E execution: executed=$executedCount, passed=$($passedResults.Count)."
          }
          catch {
            throw 'Published-image E2E produced no valid executed test result.'
          }

      - name: Upload DMS E2E Logs
        id: upload_logs
        if: always() && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduled-pre-image-${{ matrix.database_engine }}-${{ matrix.identityprovider }}-logs
          path: ${{ github.workspace }}/logs/scheduled-pre-image-${{ matrix.database_engine }}-${{ matrix.identityprovider }}
          retention-days: 10
          if-no-files-found: ignore

      - name: Upload DMS End to End Test Results
        id: upload_results
        if: always() && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduled-pre-image-${{ matrix.database_engine }}-${{ matrix.identityprovider }}-results
          path: TestResults/EdFi.DataManagementService.Tests.E2E.filtered.trx
          if-no-files-found: ignore

      - name: Fail if DMS E2E failed
        if: always() && steps.e2e.outcome == 'failure'
        run: |
          throw 'DMS E2E failed.'

      - name: Summarize DMS E2E Results
        id: summary
        if: always()
        env:
          E2E_JOB_STATUS: ${{ job.status }}
          E2E_BUILD_OUTCOME: ${{ steps.build_step.outcome }}
          E2E_TEST_OUTCOME: ${{ steps.e2e.outcome }}
          E2E_CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          E2E_TEARDOWN_OUTCOME: ${{ steps.teardown.outcome }}
          E2E_SANITIZE_OUTCOME: ${{ steps.sanitize.outcome }}
          E2E_EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          E2E_LOG_UPLOAD_OUTCOME: ${{ steps.upload_logs.outcome }}
          E2E_RESULT_UPLOAD_OUTCOME: ${{ steps.upload_results.outcome }}
        run: |
          $engineLabel = switch ($env:E2E_DATABASE_ENGINE) {
            'postgresql' { 'PostgreSQL' }
            'mssql' { 'SQL Server' }
            default { 'Unknown database engine' }
          }
          $coverageLabel = if ($env:E2E_DATABASE_ENGINE -eq 'mssql') { 'Representative MSSQL published-image E2E' } else { 'Full PostgreSQL published-image E2E' }
          $stages = [ordered]@{
            Build = $env:E2E_BUILD_OUTCOME
            Test = $env:E2E_TEST_OUTCOME
            Capture = $env:E2E_CAPTURE_OUTCOME
            Teardown = $env:E2E_TEARDOWN_OUTCOME
            Sanitize = $env:E2E_SANITIZE_OUTCOME
            Evidence = $env:E2E_EVIDENCE_OUTCOME
            'Log upload' = $env:E2E_LOG_UPLOAD_OUTCOME
            'Result upload' = $env:E2E_RESULT_UPLOAD_OUTCOME
          }
          $requiredOutcomes = @($stages.Values)
          $legPassed = $env:E2E_JOB_STATUS -eq 'success' -and $requiredOutcomes.Count -eq 8 -and @($requiredOutcomes | Where-Object { $_ -ne 'success' }).Count -eq 0
          $resultLabel = if ($legPassed) { 'passed' } else { 'failed' }
          $stageRows = foreach ($stage in $stages.GetEnumerator()) { "| $($stage.Key) | $($stage.Value) |" }
          $summaryText = @(
            "# Scheduled pre-image: $engineLabel ($env:E2E_DATABASE_ENGINE) / $env:E2E_IDENTITY_PROVIDER"
            ""
            "- **Result:** $resultLabel"
            "- **Coverage:** $coverageLabel"
            "- **Job status:** $env:E2E_JOB_STATUS"
            "- **Run:** $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            ""
            '| Stage | Outcome |'
            '| --- | --- |'
            $stageRows
          ) -join "`n"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $summaryText

      - name: Notify Slack on success
        if: success() && github.event_name != 'workflow_dispatch' && github.repository_owner == 'Ed-Fi-Alliance-OSS' && steps.e2e.outcome == 'success' && steps.evidence.outcome == 'success'
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d #v2.0.0
        with:
          payload: |
            {
              "text": "✅ Scheduled published-image E2E leg passed.\nEngine: ${{ matrix.database_engine == 'mssql' && 'SQL Server' || 'PostgreSQL' }} (${{ matrix.database_engine }})\nIdentity: ${{ matrix.identityprovider }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook

      - name: Notify Slack on failure
        if: failure() && github.event_name != 'workflow_dispatch' && github.repository_owner == 'Ed-Fi-Alliance-OSS'
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d #v2.0.0
        with:
          payload: |
            {
              "text": "❌ Scheduled published-image E2E leg failed (${{ job.status }}).\nEngine: ${{ matrix.database_engine == 'mssql' && 'SQL Server' || 'PostgreSQL' }} (${{ matrix.database_engine }})\nIdentity: ${{ matrix.identityprovider }}\nBuild: ${{ steps.build_step.outcome }}; Test: ${{ steps.e2e.outcome }}; Evidence: ${{ steps.evidence.outcome }}; Capture: ${{ steps.capture.outcome }}; Teardown: ${{ steps.teardown.outcome }}; Sanitize: ${{ steps.sanitize.outcome }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ Scheduled published-image E2E leg failed (${{ job.status }}).\n*Engine:* ${{ matrix.database_engine == 'mssql' && 'SQL Server' || 'PostgreSQL' }} (${{ matrix.database_engine }})\n*Identity:* ${{ matrix.identityprovider }}\n*Build:* ${{ steps.build_step.outcome }} | *Test:* ${{ steps.e2e.outcome }} | *Evidence:* ${{ steps.evidence.outcome }}\n*Capture:* ${{ steps.capture.outcome }} | *Teardown:* ${{ steps.teardown.outcome }} | *Sanitize:* ${{ steps.sanitize.outcome }}\n*Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
