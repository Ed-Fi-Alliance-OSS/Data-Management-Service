name: Scheduled pre Image Tests

on:
  workflow_dispatch:
  schedule:
  - cron: '30 8 * * 6' # Scheduled the job to run every Saturday at 8 AM UTC

permissions: read-all

jobs:
  test:
    name: pre Image Tests (${{ matrix.database_engine }}, ${{ matrix.identityprovider }})
    # Scheduled runs only in Ed-Fi-Alliance-OSS: a fork inherits the schedule but not the Slack
    # webhook or the Ed-Fi resources the run acts on. workflow_dispatch still runs anywhere.
    if: (github.event_name != 'schedule' || github.repository_owner == 'Ed-Fi-Alliance-OSS')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    env:
      E2E_DATABASE_ENGINE: ${{ matrix.database_engine }}
      E2E_IDENTITY_PROVIDER: ${{ matrix.identityprovider }}
      E2E_DIAGNOSTIC_DIRECTORY: ${{ github.workspace }}/logs/scheduled-pre-image-${{ matrix.database_engine }}-${{ matrix.identityprovider }}
      E2E_TRX_PATH: ${{ github.workspace }}/TestResults/EdFi.DataManagementService.Tests.E2E.filtered.trx
    strategy:
      fail-fast: false
      matrix:
        database_engine: [postgresql, mssql]
        identityprovider: [keycloak, self-contained]
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache Nuget packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: DMS Build
        id: build_step
        run: ./build-dms.ps1 Build -Configuration Release -IdentityProvider ${{ matrix.identityprovider }}

      - name: Run DMS End to End Tests
        id: e2e
        if: success()
        continue-on-error: true
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $diagnosticDirectory = $env:E2E_DIAGNOSTIC_DIRECTORY
          New-Item -ItemType Directory -Path $diagnosticDirectory -Force | Out-Null
          $setupLog = Join-Path $diagnosticDirectory 'build-dms-setup.log'
          if (Test-Path -LiteralPath $env:E2E_TRX_PATH) {
            Remove-Item -LiteralPath $env:E2E_TRX_PATH -Force
          }

          $testFilter = switch ($env:E2E_DATABASE_ENGINE) {
            'postgresql' { '(Category!=@StandardVersion-6_1)&(Category!=@DocumentCacheHostedHappyPath)&(Category!=@CursorPartitionSizing)' }
            'mssql' { 'Category=@MssqlRepresentative' }
            default { throw 'Unsupported E2E database engine.' }
          }

          & pwsh -NoProfile -File ./build-dms.ps1 E2ETest `
            -UsePublishedImage `
            -Configuration Release `
            -DatabaseEngine $env:E2E_DATABASE_ENGINE `
            -IdentityProvider $env:E2E_IDENTITY_PROVIDER `
            -EnvironmentFile './.env.e2e' `
            -TestFilter $testFilter *> $setupLog
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            throw "Published-image E2E child process failed with exit code $buildExitCode."
          }

      - name: Capture DMS E2E Docker Logs
        id: capture
        if: always()
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $diagnosticDirectory = $env:E2E_DIAGNOSTIC_DIRECTORY
          New-Item -ItemType Directory -Path $diagnosticDirectory -Force | Out-Null
          $enumerationErrorPath = Join-Path $diagnosticDirectory 'docker-ps.err'
          $containerNames = @(docker ps -a --filter 'label=com.docker.compose.project=dms-published' --format '{{.Names}}' 2> $enumerationErrorPath)
          $dockerExitCode = $LASTEXITCODE
          if ($dockerExitCode -ne 0) {
            throw 'Docker container enumeration failed; diagnostic details were retained privately.'
          }

          foreach ($container in ($containerNames | Sort-Object)) {
            if ([string]::IsNullOrWhiteSpace($container)) { continue }
            $logPath = Join-Path $diagnosticDirectory "$container.log"
            docker logs $container *> $logPath
            $dockerExitCode = $LASTEXITCODE
            if ($dockerExitCode -ne 0) {
              throw 'Docker log capture failed; diagnostic details were retained privately.'
            }
          }

      - name: Teardown DMS E2E Environment
        id: teardown
        if: always()
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $diagnosticDirectory = $env:E2E_DIAGNOSTIC_DIRECTORY
          New-Item -ItemType Directory -Path $diagnosticDirectory -Force | Out-Null
          $teardownLog = Join-Path $diagnosticDirectory 'teardown.log'
          & pwsh -NoProfile -File ./src/dms/tests/EdFi.DataManagementService.Tests.E2E/teardown-local-dms.ps1 `
            -DatabaseEngine $env:E2E_DATABASE_ENGINE `
            -EnvironmentFile './.env.e2e' *> $teardownLog
          $teardownExitCode = $LASTEXITCODE
          if ($teardownExitCode -ne 0) {
            throw "DMS E2E teardown failed with exit code $teardownExitCode; details were retained privately."
          }

      - name: Sanitize DMS E2E Diagnostic Artifacts
        id: sanitize
        if: always()
        run: |
          try {
            ./eng/ci/sanitize-e2e-artifacts.ps1 -Path $env:E2E_DIAGNOSTIC_DIRECTORY
            ./eng/ci/sanitize-e2e-artifacts.ps1 -Path $env:E2E_TRX_PATH
          }
          catch {
            throw 'E2E artifact sanitization failed; raw diagnostic content was withheld.'
          }

      - name: Upload DMS E2E Logs
        id: upload_logs
        if: always() && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduled-pre-image-${{ matrix.database_engine }}-${{ matrix.identityprovider }}-logs
          path: ${{ github.workspace }}/logs/scheduled-pre-image-${{ matrix.database_engine }}-${{ matrix.identityprovider }}
          retention-days: 10
          if-no-files-found: ignore

      - name: Upload DMS End to End Test Results
        id: upload_results
        if: always() && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduled-pre-image-${{ matrix.database_engine }}-${{ matrix.identityprovider }}-results
          path: TestResults/EdFi.DataManagementService.Tests.E2E.filtered.trx
          if-no-files-found: ignore

      - name: Fail if DMS E2E failed
        if: always() && steps.e2e.outcome == 'failure'
        run: |
          throw 'DMS E2E failed.'

      - name: Notify Slack on success
        if: success() && github.event_name != 'workflow_dispatch'
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d #v2.0.0
        with:
          payload: |
            {
              "text": "✅ Scheduled pre image tests passed for identityprovider=${{ matrix.identityprovider }}."
            }
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook

      - name: Notify Slack on failure
        if: failure() && github.event_name != 'workflow_dispatch'
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d #v2.0.0
        with:
          payload: |
            {
              "text": "❌ Scheduled pre image tests result: ${{ job.status }}\nIdentityProvider: ${{ matrix.identityprovider }}\nDMS E2E: ${{ steps.e2e.outcome }}\n${{ github.event.pull_request.html_url || github.event.head_commit.url }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ Scheduled pre image tests result: ${{ job.status }}\n*Identity Provider:* ${{ matrix.identityprovider }}\n*DMS E2E:* ${{ steps.e2e.outcome }}\n*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref }}\n*Commit Message:* ${{ github.event.head_commit.message || 'No commit message available' }}\n*Log URL:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
