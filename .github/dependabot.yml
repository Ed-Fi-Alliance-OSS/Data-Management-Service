version: 2
updates:
  - package-ecosystem: nuget
    directory: src/
    target-branch: main
    schedule:
      interval: weekly
    # Delay PRs for freshly published versions so poisoned releases can be flagged first.
    # Applies to version updates only; Dependabot security updates are not delayed.
    cooldown:
      default-days: 7
      semver-patch-days: 5
      semver-minor-days: 7
      semver-major-days: 14
  - package-ecosystem: docker-compose
    # Dependabot's Compose fetcher reads only top-level files in each directory whose names
    # contain `compose` and end in .yml, which is why the image-bearing overlays are *.compose.yml.
    directories:
      - /eng/docker-compose
      - /eng/azure-vm/compose
    target-branch: main
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # One PR per image across both directories, so a Keycloak bump changes both pins together.
    groups:
      compose-images:
        group-by: dependency-name
